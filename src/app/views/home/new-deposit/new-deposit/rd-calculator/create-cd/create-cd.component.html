<div fxLayout="column">
  <label class="highlight_title">Recurring Deposit Details</label>
  <form [formGroup]="createRdForm" fxLayout="column">
    <div class="row">
      <div class="col-md-6 col-12">
        <mat-form-field appearance="outline" class="full-width disable-field">
          <mat-label>Deposit Ammount</mat-label>
          <input
            matInput
            type="text"
            formControlName="depositAmmount"
            name="depositAmmount"
          />
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field appearance="outline" class="full-width disable-field">
          <mat-label>Deposit Ammount</mat-label>
          <input
            matInput
            type="text"
            formControlName="depositAmmount"
            name="depositAmmount"
          />
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field appearance="outline" class="full-width disable-field">
          <mat-label>Maturity Date</mat-label>
          <input
            matInput
            type="text"
            formControlName="maturityDate"
            name="maturityDate"
            [matDatepicker]="picker"
            readonly
          />
          <mat-datepicker-toggle matSuffix [for]="picker">
            <mat-icon matDatepickerToggleIcon>calendar_today</mat-icon>
          </mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field appearance="outline" class="full-width disable-field">
          <mat-label>Interest Rate</mat-label>
          <input
            matInput
            type="text"
            formControlName="interestRate"
            name="interestRate"
          />
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field appearance="outline" class="full-width disable-field">
          <mat-label>Maturity Ammount</mat-label>
          <input
            matInput
            type="text"
            formControlName="maturityAmmount"
            name="maturityAmmount"
          />
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field appearance="outline" class="full-width disable-field">
          <mat-label>Deposit Holder Type</mat-label>
          <mat-select formControlName="depositHolderType">
            <mat-option value="cumulative">Self</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field appearance="outline" class="full-width disable-field">
          <mat-label>Customer Type</mat-label>
          <mat-select formControlName="customerType">
            <mat-option value="Regular">Regular</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field appearance="outline" class="full-width disable-field">
          <mat-label>Payout Type</mat-label>
          <mat-select formControlName="payoutType">
            <mat-option value="cumulative">Cumulative</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field appearance="outline" class="full-width disable-field">
          <mat-label>Payment Type</mat-label>
          <mat-select formControlName="paymentType">
            <mat-option value="account">Account</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-checkbox formControlName="autoRenew">Auto Renew</mat-checkbox>
      </div>
    </div>
    <div fxFlex="100" fxLayout="row" fxLayoutGap="2%" style="margin-top: 50px">
      <div>
        <button
          type="button"
          mat-raised-button
          class="saveButton"
          (click)="submitCreateFd()"
        >
          Save
        </button>
      </div>
      <div>
        <button type="button" mat-raised-button class="cancelButton">
          Cancel
        </button>
      </div>
    </div>
  </form>
</div>
