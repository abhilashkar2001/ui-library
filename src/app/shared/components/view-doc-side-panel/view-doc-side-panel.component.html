<div [class.sidenav-open]="isSideNavOpen" class="sidenav">
  <div
    class="sidenav-content"
    fxLayout="column"
    fxLayoutAlign="flex-start flex-start"
  >
    <div
      class="sidenav-title w-100"
      fxLayout="row"
      fxLayoutAlign="space-between start"
    >
      <div>Document</div>
      <div
        (click)="closeSideNav()"
        (keydown.enter)="closeSideNav()"
        class="close_btn"
        tabindex="0"
      >
        <mat-icon>close</mat-icon>
      </div>
    </div>
    <div class="document_block w-100" fxLayout="column" fxLayoutGap="10px">
      <div
        *ngIf="documents.length"
        class="document_item"
        fxLayout="row"
        fxLayoutAlign="space-between flex=-start"
      >
        <ng-container>
          <div class="document_details" fxLayout="column">
            <div class="document_name">
              {{ documents[currentDocumentIndex]?.fileName }}
            </div>
            <div class="document_size">Size {{ documentSize }}</div>
          </div>
          <button
            (click)="deleteDocument(documents[currentDocumentIndex]!)"
            mat-icon-button
          >
            <img alt="" src="assets/images/trash_can.svg" />
          </button>
        </ng-container>
      </div>
      <div *ngIf="documents.length" class="document_viewer">
        <img
          (error)="imageLoadError = true"
          *ngIf="!imageLoadError"
          [alt]="documents[currentDocumentIndex]?.fileName"
          [src]="
            documents[currentDocumentIndex]?.fileUrl
              ? documents[currentDocumentIndex]?.fileUrl
              : 'assets/images/default_fallback_img.svg'
          "
          class="document-image"
        />
        <div *ngIf="imageLoadError" class="skeleton-loader"></div>
      </div>
      <div *ngIf="!documents.length" class="no-documents">
        No documents available.
      </div>
    </div>
    <div *ngIf="documents.length > 1" class="navigator">
      <div
        (click)="previousDocument()"
        (keydown.enter)="previousDocument()"
        [class.disabled]="currentDocumentIndex === 0"
        class="navigator_button"
        tabindex="1"
      >
        <img alt="" src="assets/images/arrow-front.svg" />
      </div>
      <div
        (click)="nextDocument()"
        (keydown.enter)="nextDocument()"
        [class.disabled]="currentDocumentIndex === documents.length - 1"
        class="navigator_button"
        tabindex="2"
      >
        <img alt="" src="assets/images/arrow-back.svg" />
      </div>
    </div>
  </div>
</div>
