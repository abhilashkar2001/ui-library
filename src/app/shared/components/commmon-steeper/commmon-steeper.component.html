<div fxLayout="column" fxFlex="100">
  <div fxLayout="row">
    <div>
      <div class="deposit_icon">
        <img
          src="assets/images/Bank-Profile-Logo.svg"
          alt="Bank Sign"
          width="65%"
        />
      </div>
      <span class="vertical_line"></span>
    </div>
    <div fxLayout="column" style="padding-left: 33px">
      <div style="font-size: 22px; line-height: 33px; font-weight: 400">
        Get Your
      </div>
      <div style="font-size: 28px; line-height: 48px; font-weight: 600">
        {{ screenTitle }}
      </div>
      <div style="font-size: 22px; line-height: 33px; font-weight: 400">
        in {{ screenList?.length }} simple ways
      </div>
      <div class="fd_info_stat" fxLayout="row">
        <img src="assets/images/Stopwatch.svg" alt="StopWatch" />
        <div>
          On an average, People get their savings account in 15 - 20 min
        </div>
      </div>
    </div>
  </div>
  <mat-stepper
    #stepper
    orientation="vertical"
    [linear]="isLinear"
    class="custom_steppper"
    [selectedIndex]="screenIndex"
    (selectionChange)="stepperSelectionChange($event)"
  >
    <ng-container *ngFor="let item of screenList; let i = index">
      <mat-step
        [label]="item.screenName"
        [completed]="item.completed"
        [editable]="item.isEditable"
      ></mat-step>
    </ng-container>
  </mat-stepper>
</div>
