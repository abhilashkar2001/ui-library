<div *ngIf="data" class="w-100 mb-12" fxLayoutAlign="end start">
  <mat-icon mat-dialog-close>close</mat-icon>
</div>

<div id="printableDiv">
  <ng-container *ngIf="dataLocalUrl">
    <object
      [data]="dataLocalUrl"
      type="application/pdf"
      width="100%"
      height="100%"
    ></object
  ></ng-container>
</div>
