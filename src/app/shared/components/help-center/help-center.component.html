<mat-sidenav-container *ngIf="isOpen" class="help-container">
  <mat-sidenav
    #sidenav
    (backdropClick)="closeHelp()"
    [(opened)]="isOpen"
    class="help-sidenav"
    mode="over"
    position="end"
  >
    <div class="help-header">
      <h3 class="theme_header_lg_bold">Help Center</h3>
      <button (click)="closeHelp()" mat-icon-button>
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <mat-divider></mat-divider>
    <div class="help-content">
      <mat-form-field appearance="outline">
        <mat-label>Search</mat-label>
        <input matInput placeholder="Search" />
      </mat-form-field>
      <h4 class="header_gt_md_bold_black">Enter Mobile Number:</h4>
      <p class="header_md">- The mobile number for instant login...</p>
      <h4 class="header_gt_md_bold_black">Get OTP:</h4>
      <p class="header_md">- Based on mobile number, we send OTP...</p>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
