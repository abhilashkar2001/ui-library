<div class="uploaded-images-container full-width">
  <div class="uploaded-images-section full-width">
    <div class="uploaded-images full-width" fxLayout="row">
      <!-- <mat-icon>check_circle</mat-icon> -->
      <!-- <img src="../../../../assets/images/account-img1.png" alt="" /> -->
      <img [src]="getFileUrl(document.fileUrl)" alt="" />
      <div
        class="image_icon_container"
        fxLayout="column"
        fxLayout="start start"
      >
        <img
          src="assets/images/done-mark-sm.png"
          class="susscess_img"
          alt="done-mark image"
        />
      </div>
      <!-- <mat-icon>delete</mat-icon> -->
    </div>
  </div>
  <div class="btn_wrapper" fxLayoutAlign="center center">
    <button
      type="button"
      mat-flat-button
      class="upload_btn"
      (click)="viewFiles(document.fileUrl, document)"
    >
      View
    </button>
  </div>
</div>
