<div fxLayout="column" fxLayoutGap="25px">
  <!-- <div fxLayoutAlign="end center">
    <mat-icon (click)="close()">close</mat-icon>
  </div> -->
  <div class="alertText">
    <div>Application is submitted successfully.</div>
  </div>
  <div class="alertText">
    <div>We will review and get back to you.</div>
  </div>
  <div class="alertImage">
    <img
      class="summaryIcon"
      src="assets/images/success-Logo.svg"
      alt="Success Sign"
    />
  </div>

  <div fxLayout="row" style="display: flex; justify-content: center">
    <div class="refrence_no_div">
      <div class="refrence_no_innerDiv">
        Application No. : <span>{{ originationId }}</span>
      </div>
    </div>
  </div>
  <br />
</div>
<div fxLayout="column">
  <div class="note_background">
    <span class="higlight_note">Note:</span> Please quote the above reference
    number in all communications with the bank
  </div>
  <!-- <div class="btnGroup">
    <button class="saveButton" mat-raised-button>Done</button>
  </div> -->
</div>
<div fxLayout="column" fxLayoutAlign="center center" class="btnClass">
  <!-- <div fxLayout="row" fxLayoutAlign="space-between center">
    <button type="button" mat-raised-button class="downloadButton done_btn">
      share
    </button>
    <button type="button" mat-raised-button class="downloadButton done_btn">
      Download
    </button>
  </div> -->
  <div fxLayout="row" style="margin-bottom: 5%">
    <button
      type="button"
      class="shareBtn"
      mat-raised-button
      (click)="sendEmail()"
    >
      <mat-icon>share</mat-icon>Share
    </button>
    &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp;
    <button
      type="button"
      class="shareBtn"
      mat-raised-button
      (click)="download()"
    >
      <mat-icon>download</mat-icon>Download
    </button>
  </div>
  <div>
    <button
      type="button"
      mat-raised-button
      class="saveButton done_btn"
      (click)="done()"
    >
      Done
    </button>
  </div>
</div>
