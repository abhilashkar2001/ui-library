<div fxLayout="column" fxLayoutGap="25px">

    <img (click)="close()" src="assets/images/close.svg" />
  </div>

    <div>Application is submitted successfully.</div>
  </div>
  <div class="alertText">
    <div>We will review and get back to you.</div>
  </div>
  <div class="alertImage">
    <img class="summaryIcon" src="assets/images/Group 1612.svg" alt="..." />
  </div>

  <div fxLayout="row" style="display: flex; justify-content: center">
    <div class="refrence_no_div">
      <div class="refrence_no_innerDiv">
        Application No. : <span>{{ originationId }}</span>
      </div>
    </div>
  </div>
  <br />
</div>
