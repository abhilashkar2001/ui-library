<div fxFlex="100" fxLayout="column" class="new-popup">
  <div fxLayout="row" fxLayoutAlign="space-between center" class="titleMainDiv">
    <div class="title-div">
      <span>Select Template</span>
      <!-- <ng-template #showTemplate>Template Name</ng-template> -->
    </div>
  </div>
  <div fxLayout="column" fxLayoutAlign="center">
    <div class="verification-card py-4">
      <ng-container *ngIf="!isSaveTemplate">
        <!-- <div fxLayout="row" class="full-width mb-12 p-0">
          <div
            fxFlex="50"
            fxLayout="column"
            fxLayoutAlign="center center"
            class="customer-type"
            [ngClass]="{ 'customer-type-selected': !checkToggle }"
            (click)="customerToggle(false)"
          >
            <div>Select Template</div>
          </div>
          <div
            fxFlex="50"
            fxLayout="column"
            fxLayoutAlign="center center"
            class="customer-type"
            [ngClass]="{ 'customer-type-selected': checkToggle }"
            (click)="customerToggle(true)"
          >
            <div>Add New</div>
          </div>
        </div> -->
        <div fxLayout="column">
          <mat-label class="custom-label">Template Name</mat-label>
          <mat-form-field appearance="outline" class="custom-field">
            <mat-select [(ngModel)]="templateName" panelClass="template_field">
              <mat-select-trigger (keydown.space)="$event.stopPropagation()">
                <span class="example-additional-selection">
                  {{ templateName }}
                </span>
              </mat-select-trigger>
              <mat-option [value]="">Select</mat-option>
              <mat-option
                [value]="item.templateName"
                *ngFor="let item of templateDetails"
              >
                <ng-container>
                  <div fxLayout="row">
                    <div>
                      <img
                        src="assets/images/file_img.svg"
                        class="current_theme_filter"
                      />
                    </div>
                    <div fxLayout="column" class="template_container">
                      <label class="template_name">{{
                        item.templateName
                      }}</label>
                      <span class="templat_desc"
                        >{{ item.type }} | {{ item.date }} |
                        {{ item.applicant }}</span
                      >
                    </div>
                  </div>
                </ng-container>
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </ng-container>
      <ng-container *ngIf="isSaveTemplate">
        <mat-form-field appearance="outline" class="custom-field">
          <mat-label class="autolabel">Template Name</mat-label>
          <input matInput type="text" [(ngModel)]="templateName" />
        </mat-form-field>
      </ng-container>
      <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="20px">
        <button mat-flat-button class="submit-button" (click)="onSubmit()">
          <span> Submit</span>
        </button>
        <button mat-flat-button class="exit-button" (click)="onBack()">
          Back
        </button>
      </div>
    </div>
  </div>
</div>
