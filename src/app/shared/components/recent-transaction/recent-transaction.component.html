<div fxLayout="row" fxLayoutAlign="space-between" class="recentTitleLine">
  <div class="send-money-title">{{ 'Recent Transaction' | translate }}</div>

  <button mat-icon-button class="extent_icon_btn">
    <mat-icon
      class="extend-icon current_theme_filter"
      svgIcon="extend-icon"
      (click)="gotoBillTransaction()"
    ></mat-icon>
  </button>
</div>
<mat-card fxLayout="column" class="tabs p-8">
  <div fxLayout="row" class="header-box" fxLayoutAlign="space-between">
    <div
      fxFlex="48"
      class="recent-tabs-box"
      fxLayout="row"
      fxLayoutAlign="space-between"
    >
      <div
        fxLayout="column"
        class="tab-box"
        fxLayoutAlign="space-between"
        *ngFor="let item of recentTransTabs; let i = index"
      >
        <div
          [ngClass]="
            selectedRecentTab === item ? 'light-blue-title' : 'recent-tabs'
          "
          (click)="changeRecentTransTabs(i)"
          (keydown.enter)="changeRecentTransTabs(i)"
          tabindex="0"
        >
          {{ item | translate }}
        </div>
        <div
          [ngClass]="selectedRecentTab === item ? 'horizontal-line' : ''"
        ></div>
      </div>
    </div>
  </div>
  <div class="table">
    <app-reusable-table
      [columnNames]="recentTransCols"
      [data]="recentTransData"
      [customerInfo]="customerInfo"
      [selectedAcc]="selectedAcc"
      [showMoneyStatusIcon]="showMoneyStatusIcon"
      [allowScrollable]="true"
    ></app-reusable-table>
  </div>
</mat-card>
