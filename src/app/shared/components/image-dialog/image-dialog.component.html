<div fxFlex="100" class="imageDisplayDiv">
  <div fxLayout="row" fxLayoutAlign="space-between" class="imageNameDisplayDiv">
    <div fxLayoutAlign="start" class="imgName">{{ data.imageName }}</div>
    <img (click)="closeDialog()" src="assets/images/cancelIcon.svg" />
    <!-- <mat-icon >close</mat-icon> -->
  </div>
  <div class="imageView">
    <img class="images expanded_view" [src]="getFileUrl(data.imageUrl)" />
  </div>
</div>
