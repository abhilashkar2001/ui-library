<div fxLayout="column">
  <div class="kycToggle row" fxFlex="100">
    <button
      fxFlex="50"
      class="col-md-6"
      [ngClass]="kycToggle == 'kyc' ? 'toggled' : ''"
      (click)="kycToggle = 'kyc'"
      mat-raised-button
    >
      Select Kyc
    </button>
    <button
      fxFlex="50"
      class="col-md-6"
      [ngClass]="kycToggle == 'addDoocuent' ? 'toggled' : ''"
      (click)="kycToggle = 'addDoocuent'"
      mat-raised-button
    >
      Use Other Documents
    </button>
  </div>
  <!--select start here -->
  <div *ngIf="kycToggle == 'kyc'">
    <app-select-kyc></app-select-kyc>
  </div>
  <!-- select kyc  ends here -->

  <!-- other documents start here -->
  <div fxLayout="column" *ngIf="kycToggle == 'addDoocuent'">
    <form
      *ngIf="createDocumentForm"
      fxLayout="column"
      fxFlex="100"
      [formGroup]="createDocumentForm"
    >
      <div formArrayName="otherDocument">
        <div *ngFor="let denomDetai of otherDocument().controls; let i = index">
          <mat-card fxFlex="98%" fxLayout="column" [formGroupName]="i">
            <div fxLayout="column" class="outer-div" fxFlex="100">
              <div fxLayout="column">
                <div class="text-header">
                  <div fxFlex="80">Document {{ i + 1 }}</div>
                  <div fxFlex="20">
                    <button class="deleteButton" (click)="removeCurrency(i)">
                      Delete
                    </button>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 col-12">
                    <mat-form-field
                      fxFlex="100"
                      class="borderColor"
                      appearance="outline"
                    >
                      <mat-label class="label_input">Document Type</mat-label>
                      <mat-select
                        appearance="outline"
                        class="mat_selection"
                        formControlName="documentType"
                      >
                        <mat-option
                          *ngFor="let documentTypeItem of documentTypeArray"
                          class="option_font"
                          [value]="documentTypeItem"
                          >{{ documentTypeItem }}</mat-option
                        >
                      </mat-select>
                      <mat-error> Please Select Document Type </mat-error>
                    </mat-form-field>
                  </div>
                  <div class="col-md-6 col-12">
                    <mat-form-field appearance="outline" style="display: block">
                      <mat-label class="custom-mat-label"
                        >Document Number</mat-label
                      >
                      <input matInput formControlName="documentNumber" />
                    </mat-form-field>
                  </div>
                </div>
                <ng-container>
                  <mat-card class="card-subdiv">
                    <div
                      class="doc_upload"
                      fxFlex="100"
                      #fileInput
                      (click)="fileBrowseHandler($event, i)"
                    >
                      <div class="drag_drop" fxFlex="90">
                        <h3 class="text-header">Upload Document</h3>
                        <p>
                          On desktop, Simply drag and drop your file in this
                          field. acceptable formats: JPEG, JPG or PNG.
                        </p>
                      </div>
                      <label for="fileDropRef" class="doc_img" fxFlex="10">
                        <img src="assets/images/Group 2979.svg" />
                      </label>
                    </div>
                    <ng-container
                      *ngFor="let file of getFileInfo(i); let fileIndx = index"
                    >
                      <div class="upload_img" fxFlex="100">
                        <div class="img_box">
                          <img [src]="file?.url" />
                          <!-- <img src="assets/images/Rectangle 1779.png" /> -->
                        </div>
                        <div class="img_container">
                          <p class="img_name">{{ file?.name }}</p>
                          <div class="progress-cont">
                            <div class="progress" [style.width]="'100%'"></div>
                          </div>
                        </div>
                        <button
                          mat-icon-button
                          class="btn"
                          (click)="deleteFile(fileIndx, i, file)"
                        >
                          <mat-icon color="warn">delete</mat-icon>
                        </button>
                      </div>
                    </ng-container>
                  </mat-card>
                </ng-container>
              </div>
            </div>
          </mat-card>
        </div>
      </div>
    </form>
    <mat-card class="text-doc card-div" (click)="addDocument()"
      >Add another Document</mat-card
    >
    <div>
      <button
        type="button"
        mat-raised-button
        class="saveButton"
        (click)="onSubmit()"
      >
        Submit
      </button>
      <button
        type="button"
        mat-raised-button
        class="backButton"
        (click)="goBack()"
      >
        Back
      </button>
    </div>
  </div>
  <!-- other documents ends here -->
</div>
