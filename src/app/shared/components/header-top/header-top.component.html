<header class="navbar">
  <div class="container">
    <div class="row w-100 d-flex align-items-center">
      <div class="col-10 col-md-6">
        <div class="logo" (click)="goToHomePage()">
          <img src="assets/images/Group 5698.svg" alt="logo" />
          <p class="logo_text">DemoBank</p>
        </div>
      </div>
      <nav
        class="col-2 col-md-6 d-md-flex justify-content-md-center align-items-md-center"
        *ngIf="!hideNavItem"
      >
        <!-- <ul class="d-none d-md-flex"> -->
        <ul [ngClass]="showMobilemenu ? 'show_menu' : 'hide_menu'">
          <ng-container *ngFor="let item of items">
            <li (click)="onNavTabClick(item)">
              <a
                [routerLink]="[item.route]"
                routerLinkActive="highlight_label"
                #element
                >{{ item?.label }}</a
              >
            </li>
          </ng-container>
        </ul>
        <mat-icon
          role="button"
          class="d-flex d-md-none"
          (click)="toggleMobileNavMenu()"
          >menu</mat-icon
        >
      </nav>
    </div>
  </div>
  <div id="underline"></div>
</header>
