<header class="navbar">
  <div class="container">
    <div class="w-100 d-flex justify-content-between align-items-center">
      <div class="logo" (click)="goToHomePage()">
        <img src="assets/images/Group 5698.svg" alt="logo" />
        <p class="logo_text">DemoBank</p>
      </div>
      <nav class="d-flex align-items-md-center" *ngIf="!hideNavItem">
        <ul [ngClass]="showMobilemenu ? 'show_menu' : 'hide_menu'">
          <ng-container *ngFor="let item of items">
            <li (click)="onNavTabClick(item)">
              <a
                [routerLink]="[item.route]"
                routerLinkActive="highlight_label"
                #element
                >{{ item?.label }}</a
              >
            </li>
          </ng-container>
          <div
            fxLayout="column"
            class="align_top_items dropdown pr-16 position-relative"
          >
            <button class="login" fxLayoutAlign="space-evenly center">
              Log In
              <mat-icon>keyboard_arrow_down</mat-icon>
            </button>
            <div class="dropdown-content" fxLayout="column">
              <div fxLayout="column" class="bg-color plr-8">
                <span
                  class="flex-spaceAround-center h-50 plr-12 cursor-pointer"
                  (click)="openDropdown(1)"
                  [class.active-button]="expand == 1"
                >
                  Net Banking
                  <mat-icon>keyboard_arrow_down</mat-icon>
                </span>
                <span *ngIf="expand == 1" fxLayout="column" class="sub-value">
                  <span
                    class="flex-spaceAround-center h-50 plr-8 cursor-pointer sub_value_menu"
                    (click)="redirectToInternet()"
                  >
                    Personal
                    <mat-icon>keyboard_arrow_right</mat-icon>
                  </span>
                  <span
                    class="flex-spaceAround-center h-50 plr-8 cursor-pointer sub_value_menu"
                    (click)="redirectToSignIn()"
                  >
                    Corporate
                    <mat-icon>keyboard_arrow_right</mat-icon>
                  </span>
                </span>
              </div>
              <span
                class="flex-spaceAround-center bg-color h-50 plr-20 cursor-pointer"
              >
                Cards
                <mat-icon>keyboard_arrow_down</mat-icon>
              </span>
              <span
                class="flex-spaceAround-center bg-color h-50 plr-20 cursor-pointer"
              >
                Remit Money
              </span>
              <span
                class="flex-spaceAround-center bg-color h-50 plr-20 cursor-pointer"
                (click)="trackingStatus()"
              >
                Tracking Status
              </span>
            </div>
          </div>
        </ul>
        <mat-icon
          role="button"
          class="d-flex d-lg-none"
          (click)="toggleMobileNavMenu()"
        >
          more_vert
        </mat-icon>
      </nav>
    </div>
  </div>
  <div id="underline"></div>
</header>
<app-spinner></app-spinner>
