<mat-toolbar class="nav-bar">
  <div
    fxFlex="100"
    fxLayoutAlign="space-between center"
    class="sub_nav_menu_container"
  >
    <div
      class="nav_item"
      routerLinkActive="open"
      *ngFor="let item of navigationItems"
      [routerLink]="item?.link"
    >
      <img [src]="item.icon" alt="icon" />
    </div>
  </div>
</mat-toolbar>
