<mat-toolbar class="nav-bar">
  <div fxFlex="100" fxLayoutAlign="space-between center">
    <button
      mat-button
      routerLinkActive="open"
      *ngFor="let item of navigationItems"
      (click)="navigateByUrl(item)"
    >
      <img [src]="item.icon" />
    </button>
  </div>
</mat-toolbar>
