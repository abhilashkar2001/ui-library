<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Include Bootstrap CSS (Make sure to replace the version with the one you are using) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <section class="plan_accordion">
      <div class="container">
        <div class="row">
          <h1 class="section_heading">Our Top Performing Plans</h1>
          <p class="section_subHeading">
            Select wisely from our plans & invest your money for higher returns.
          </p>
        </div>
        <div class="row">
          <div class="col-12 col-md-9 mx-auto accordion_container">
            <div class="accordion" id="accordionPanelsStayOpenExample">
              <!-- Money Market -->
              <div class="accordion-item">
                <h2 class="accordion-header" id="panelsStayOpen-headingOne">
                  <button
                    class="accordion-button"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#panelsStayOpen-collapseOne"
                    aria-expanded="true"
                    aria-controls="panelsStayOpen-collapseOne"
                  >
                    Money Market
                    <span class="text-place"
                      >{{ moneyMarket?.length }} Found</span
                    >
                  </button>
                </h2>
                <div
                  id="panelsStayOpen-collapseOne"
                  class="accordion-collapse collapse show"
                  aria-labelledby="panelsStayOpen-headingOne"
                >
                  <div class="accordion-body">
                    <!-- Money Market Content -->
                    <div
                      class="accordion_single_list"
                      *ngFor="
                        let market of !isMoneyMarketReadMore
                          ? moneyMarket?.slice(0, 5)
                          : moneyMarket
                      "
                    >
                      <!-- Content for each item -->
                      <h3 class="list_name">{{ market?.name }}</h3>
                      <div class="list_img">
                        <img
                          [src]="
                            market?.increased
                              ? '/assets/images/system-uicons_graph-increase.png'
                              : '/assets/images/system-uicons_graph-increase (1).png'
                          "
                        />
                        <span
                          [ngClass]="
                            market?.increased
                              ? 'range-text-green green_text'
                              : 'range-text-green red_text'
                          "
                        >
                          {{ market?.value }}
                        </span>
                      </div>
                    </div>
                    <!-- View All Button -->
                    <div
                      class="accordion_single_list d-flex justify-content-center"
                      (click)="isMoneyMarketReadMore = !isMoneyMarketReadMore"
                    >
                      <button type="button" class="view_all">
                        View {{ isMoneyMarketReadMore ? "Less" : "All" }}
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Stocks -->
              <div class="accordion-item">
                <h2 class="accordion-header" id="panelsStayOpen-headingTwo">
                  <button
                    class="accordion-button collapsed"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#panelsStayOpen-collapseTwo"
                    aria-expanded="false"
                    aria-controls="panelsStayOpen-collapseTwo"
                  >
                    Stocks
                    <span class="text-place">{{ stocks?.length }} Found</span>
                  </button>
                </h2>
                <div
                  id="panelsStayOpen-collapseTwo"
                  class="accordion-collapse collapse"
                  aria-labelledby="panelsStayOpen-headingTwo"
                >
                  <div class="accordion-body">
                    <!-- Stocks Content -->
                    <div
                      class="accordion_single_list"
                      *ngFor="
                        let stock of !isStocksIsReadMore
                          ? stocks?.slice(0, 5)
                          : stocks
                      "
                    >
                      <!-- Content for each item -->
                      <h3 class="list_name">{{ stock?.stock }}</h3>
                      <div class="list_img">
                        <img
                          [src]="
                            stock?.increased
                              ? '/assets/images/system-uicons_graph-increase.png'
                              : '/assets/images/system-uicons_graph-increase (1).png'
                          "
                        />
                        <span
                          [ngClass]="
                            stock?.increased
                              ? 'range-text-green green_text'
                              : 'range-text-green red_text'
                          "
                        >
                          {{ stock?.value }}
                        </span>
                      </div>
                    </div>
                    <!-- View All Button -->
                    <div
                      class="accordion_single_list d-flex justify-content-center"
                      (click)="isStocksIsReadMore = !isStocksIsReadMore"
                    >
                      <button type="button" class="view_all">
                        View{{ isStocksIsReadMore ? "Less" : "All" }}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Include Bootstrap JS and Popper.js (Make sure to replace the version with the one you are using) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
