<button
  mat-raised-button
  class="loading_submit {{ btnClass }}"
  [type]="type"
  [disabled]="disable"
  [ngClass]="{
    loading: loading,
    active: !disable
  }"
>
  <div class="btn-spinner" *ngIf="loading"></div>
  <span *ngIf="!loading">
    <ng-content></ng-content>
  </span>
  <span class="loadingText" *ngIf="loading">{{ loadingText }}</span>
</button>
