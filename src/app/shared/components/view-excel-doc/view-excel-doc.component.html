<div class="loan-doc-modal" style="overflow-y: hidden">
  <div class="mb-24" fxLayout="row" fxLayoutAlign="space-between center">
    <span class="fileName">
      {{ fileName }}
    </span>
    <mat-card
      (click)="closeDialog()"
      class="close-card"
      fxLayoutAlign="center center"
    >
      <mat-icon style="color: var(--ic-clr-primary-a10)"> close</mat-icon>
    </mat-card>
  </div>
  <div style="overflow: auto">
    <mat-table [dataSource]="dataSource" class="w-full">
      <ng-container
        *ngFor="let header of tableHeader"
        [matColumnDef]="header?.headerCell || header"
      >
        <mat-header-cell *matHeaderCellDef>
          {{ header?.headerCell || header }}
        </mat-header-cell>
        <mat-cell *matCellDef="let element">
          {{ element[header?.headerDef || header] }}
        </mat-cell>
      </ng-container>

      <mat-header-row
        *matHeaderRowDef="
          displayedColumns?.[0] ? displayedColumns : tableHeader
        "
      ></mat-header-row>
      <mat-row
        *matRowDef="
          let row;
          columns: displayedColumns?.[0] ? displayedColumns : tableHeader
        "
      ></mat-row>
    </mat-table>
  </div>
</div>
