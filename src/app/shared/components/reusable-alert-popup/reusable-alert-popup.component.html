<div fxLayout="column">
  <div fxLayout="row" fxLayoutAlign="end">
    <mat-icon (click)="cancel()"> cancel_presentation</mat-icon>
  </div>
  <div class="alertImage">
    <img class="summaryIcon" src="assets/images/error-icon.svg" alt="..." />
  </div>
  <div fxLayout="column">
    <div class="alertText">
      {{ message }}
    </div>
  </div>
  &nbsp;
  <div
    class="button-section"
    fxLayout="row"
    fxLayoutGap="50px"
    fxLayoutAlign="center center"
  >
    <button mat-raised-button class="confirm-button" (click)="done()">
      {{ isNextButton ? "Next" : "Yes" }}
    </button>

    <button
      mat-raised-button
      class="back-button"
      (click)="cancel()"
      *ngIf="!isNextButton"
    >
      No
    </button>
  </div>
</div>
