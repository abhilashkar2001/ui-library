<div style="text-align: center; margin-top: 30px" class="canvas_container">
  <canvas
    #canvas
    (mousedown)="handleMouseDown($event)"
    (mousemove)="handleMouseMove($event)"
    (mouseup)="handleMouseUp()"
    (mouseleave)="handleMouseUp()"
    width="740"
    height="150"
  >
  </canvas>
  <button mat-icon-button (click)="clearCanvas()">
    <mat-icon svgIcon="reload-icon"></mat-icon>
  </button>
</div>
