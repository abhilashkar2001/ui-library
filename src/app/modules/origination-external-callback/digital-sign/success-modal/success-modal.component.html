<div
  class="success-modal"
  fxLayout="column"
  fxLayoutAlign="space-between center"
>
  <div class="full-width mb-12" fxLayoutAlign="end stretch">
    <mat-icon mat-dialog-close>close</mat-icon>
  </div>
  <ng-container *ngIf="screenData?.title">
    <h2 class="text-center text-title">{{ screenData?.title }}</h2>
  </ng-container>
  <ng-container *ngIf="screenData?.desc">
    <mat-hint class="text-desctext-center text-title">{{
      screenData?.desc
    }}</mat-hint>
  </ng-container>
  <div fxLayoutAlign="center center" class="full-width">
    <img
      [src]="screenData?.imgUrl ?? 'assets/images/success-logo.svg'"
      class="main-img"
    />
  </div>

  <div class="text-center mt-12 text-carbon" *ngIf="screenData.alert">
    {{ screenData.alert }}
  </div>

  <div class="text-center mt-12 p-12 alert-div" *ngIf="screenData.refNo">
    <span class="text-normal"
      >Reference No:
      <span class="text-highlighted">{{ screenData.refNo }}</span></span
    >
  </div>
  <div class="full-width mt-24 mb-12" fxLayoutAlign="center">
    <button
      mat-raised-button
      type="button"
      color="primary"
      mat-dialog-close
      class="uploadButton"
    >
      Done
    </button>
  </div>
</div>
