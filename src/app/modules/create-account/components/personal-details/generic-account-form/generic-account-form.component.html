<form [formGroup]="customerForm" class="generic"></form>

<div fxLayout="column">
  <div
    fxFlex="100"
    fxLayout="row wrap"
    fxLayoutGap="10"
    fxLayoutAlign="start center"
  >
    <ic-select
      [control]="getKycInfo().get('prefixId') | formcontrol"
      [options]="genericValue?.['PREFIX']"
      bindLabelKey="values"
      bindValueKey="id"
      fxFlex="24"
      label="Prefix"
    ></ic-select>
    <ic-form-field
      [control]="getKycInfo().get('firstName') | formcontrol"
      [icAlphabetOnly]="true"
      [maxLength]="20"
      fxFlex="24"
      label="First Name"
    ></ic-form-field>

    <ic-form-field
      [control]="getKycInfo().get('lastName') | formcontrol"
      [icAlphabetOnly]="true"
      [maxLength]="20"
      fxFlex="24"
      label="Last Name"
    ></ic-form-field>

    <ic-date-picker
      [control]="getKycInfo().get('dateOfBirth') | formcontrol"
      [maxDate]="dobMinDate"
      [minDate]="dobMaxDate"
      placeholder="dateFormat"
      fxFlex="24"
      label="DateOfBirth"
    >
    </ic-date-picker>

    <ic-select
      [control]="getKycInfo().get('genderId') | formcontrol"
      [options]="genericValue?.['GENDER']"
      bindLabelKey="values"
      bindValueKey="id"
      fxFlex="24"
      label="Gender"
    ></ic-select>

    <ic-select
      [control]="getKycInfo().get('maritalStatusId') | formcontrol"
      [options]="genericValue?.['MARITAL_STATUS']"
      bindLabelKey="values"
      bindValueKey="id"
      fxFlex="24"
      label="Marital Status"
    ></ic-select>

    <ic-select
      [control]="getKycInfo().get('nationality') | formcontrol"
      [options]="nationalityArray"
      bindLabelKey="nationality"
      bindValueKey="nationality"
      fxFlex="24"
      label="Nationality"
    ></ic-select>

    <ic-select
      [control]="getKycInfo().get('countryOfResidence') | formcontrol"
      [options]="countryArray"
      bindLabelKey="countryName"
      bindValueKey="countryName"
      fxFlex="24"
      label="Country of residence"
    ></ic-select>
  </div>

  <div fxLayout="column" class="mt-16">
    <div class="header_md_bold_black">Identification Details</div>
    <div
      fxFlex="100"
      fxLayout="row wrap"
      fxLayoutGap="10"
      fxLayoutAlign="start center"
    >
      <ic-form-field
        [control]="
          getIdentificationDetails().get('identificationNumber') | formcontrol
        "
        fxFlex="24"
        label="Identification Number"
      ></ic-form-field>
      <ic-select
        [control]="
          getIdentificationDetails().get('countryOfIssue') | formcontrol
        "
        [options]="countryArray"
        bindLabelKey="countryName"
        bindValueKey="countryName"
        fxFlex="24"
        label="Country of Issue"
      ></ic-select>

      <ic-date-picker
        [control]="getIdentificationDetails().get('issueDate') | formcontrol"
        [maxDate]="todayDate"
        fxFlex="24"
        label="Date Issued"
      ></ic-date-picker>

      <ic-date-picker
        [control]="
          getIdentificationDetails().get('passportExpiryDate') | formcontrol
        "
        [minDate]="getExpDateMin()"
        placeholder="dateFormat"
        fxFlex="24"
        label="Expiry Date"
      >
      </ic-date-picker>
    </div>
  </div>

  <div fxLayout="column" class="mt-16">
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="100">
      <div class="header_md_bold_black">Contact Address</div>

      <div fxFlex="48" fxLayout="row" fxLayoutGap="5">
        <mat-label class="header_md">Same as Permanent Address*</mat-label>
        <div fxLayout="row" fxLayoutGap="20x">
          <ic-radio-button
            *ngFor="let address of addressTypeArr"
            [control]="customer.get('isSameAddress') | formcontrol"
            [label]="address.label"
            [value]="address.value"
          >
          </ic-radio-button>
        </div>
      </div>
    </div>

    <div
      fxFlex="100"
      fxLayout="row wrap"
      fxLayoutGap="10"
      fxLayoutAlign="start center"
    >
      <ng-container
        *ngIf="customer.get('contact.address')?.value as addressControl"
      >
        <ng-container
          *ngFor="
            let addressGroup of (
              customer?.get('contact')?.get('address') | formarray
            ).controls;
            let addressIndex = index
          "
          [formGroup]="addressGroup | formgroup"
        >
          <ic-form-field
            [control]="addressGroup.get('address1') | formcontrol"
            [maxLength]="200"
            fxFlex="49"
            label="Address1"
          ></ic-form-field>
          <ic-form-field
            [control]="addressGroup.get('address2') | formcontrol"
            [maxLength]="200"
            fxFlex="49"
            label="Address2"
          ></ic-form-field>
          <ic-select
            [control]="addressGroup.get('residenceType') | formcontrol"
            [options]="residenceTypeArray"
            bindLabelKey="values"
            bindValueKey="id"
            fxFlex="24"
            label="Residential Status"
          ></ic-select>
          <ic-form-field
            [control]="addressGroup.get('address2') | formcontrol"
            fxFlex="24"
            label="Suburb"
          ></ic-form-field>
          <ic-form-field
            (onSuffixClick)="pincodeExpansion(i, 'customer')"
            [control]="addressGroup.get('pincode') | formcontrol"
            [icNumbersOnly]="true"
            [maxLength]="10"
            fxFlex="24"
            label="Postal Code"
            suffixIcon="search"
          ></ic-form-field>
          <ic-form-field
            [control]="addressGroup.get('cityName') | formcontrol"
            fxFlex="24"
            label="City"
          ></ic-form-field>
          <ic-date-picker
            [control]="addressGroup.get('livingAddressSince') | formcontrol"
            fxFlex="24"
            label="Living Address Since"
          >
          </ic-date-picker>
        </ng-container>
      </ng-container>
    </div>
  </div>

  <div fxLayout="column" class="mt-16">
    <ng-container *ngIf="showSpouseSection[i]">
      <div class="header_md_bold_black">Spouse Details</div>
      <div
        fxFlex="100"
        fxLayout="row wrap"
        fxLayoutGap="10"
        fxLayoutAlign="start center"
      >
        <ic-select
          [control]="getSpouseInfo(i).get('prefixId') | formcontrol"
          [options]="prefixArray"
          bindLabelKey="values"
          bindValueKey="id"
          fxFlex="24"
          label="Prefix"
        ></ic-select>

        <ic-form-field
          [control]="getSpouseInfo(i).get('firstName') | formcontrol"
          [icAlphabetOnly]="true"
          [maxLength]="20"
          fxFlex="24"
          label="First Name"
        ></ic-form-field>

        <ic-form-field
          [control]="getSpouseInfo(i).get('lastName') | formcontrol"
          [icAlphabetOnly]="true"
          [maxLength]="20"
          fxFlex="24"
          label="Last Name"
        ></ic-form-field>

        <ic-date-picker
          [control]="getSpouseInfo(i).get('dateOfBirth') | formcontrol"
          dateFormat=""
          fxFlex="24"
          label="DateofBirth"
        >
        </ic-date-picker>
        <ic-form-field
          [control]="getSpouseContactDetails(i).get('telephone') | formcontrol"
          [icNumbersOnly]="true"
          [maxLength]="20"
          fxFlex="24"
          label="Spouse Telephone (Home)"
        ></ic-form-field>
        <ic-form-field
          [control]="
            getSpouseContactDetails(i).get('workTelephone') | formcontrol
          "
          [icNumbersOnly]="true"
          [maxLength]="20"
          fxFlex="24"
          label="Spouse Telephone (Work)"
        ></ic-form-field>
        <ic-mobile-field
          [formControl]="getSpouseContactDetails(i).get('mobile') | formcontrol"
          [isdCode]="countriesIsdCodes"
          [isdControl]="
            getSpouseContactDetails(i).get('mobtCode') | formcontrol
          "
          [maxLength]="maxMobileLength"
          fxFlex="24"
          label="Mobile Number"
        ></ic-mobile-field>
        <ic-form-field
          [control]="getSpouseContactDetails(i).get('email') | formcontrol"
          [icNoSpace]="true"
          [maxLength]="250"
          fxFlex="24"
          label="Email ID"
          [customError]="
            getSpouseContactDetails(i).get('email')?.hasError('pattern')
              ? 'Please enter Valid Email'
              : ''
          "
        ></ic-form-field>
        <ic-select
          [control]="getSpouseInfo(i).get('employeeStatusId') | formcontrol"
          [options]="empoymentArray"
          bindLabelKey="values"
          bindValueKey="id"
          fxFlex="24"
          label="Employee status"
        ></ic-select>
        <ic-form-field
          [control]="getSpouseInfo(i).get('netIncome') | formcontrol"
          [decimalPlaces]="3"
          [icTwoDigitDecimalNumber]="true"
          [maxLength]="22"
          [numLength]="22"
          fxFlex="24"
          label="Net Income"
        ></ic-form-field>
      </div>
    </ng-container>
  </div>
