<div fxLayout="column">
  <div
    fxLayout="column"
    fxLayoutAlign="center center"
    class="product-desc-container"
  >
    <div class="account-type-header mb-10">{{ basisClass }}</div>
    <div class="standard-content-title mb-30">
      This is a process, how you can get loan for your self.
    </div>
  </div>

  <div *ngFor="let subAccount of subClassList; let index = index">
    <app-common-product
      [subAccount]="subAccount"
      [productIndex]="index"
      (onApply)="apply($event)"
      (customClassApply)="apply($event)"
    >
    </app-common-product>
  </div>
</div>
