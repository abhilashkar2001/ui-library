<div fxLayout="column">
  <div fxLayout="column" fxLayoutAlign="center center">
    <div class="account-type-header mb-10">{{ basisClass }}</div>
    <div class="standard-content-title mb-30">
      This is a process, how you can get loan for your self.
    </div>
  </div>

  <div *ngFor="let subAccount of subClassList; let index = index">
    <div fxFlex="100" fxLayout="row" style="margin: 0% 4%">
      <div
        class="loan-container"
        [ngStyle]="{
          'flex-direction': index % 2 !== 0 ? 'row-reverse' : 'row',
          padding: index % 2 !== 0 ? '20px' : ''
        }"
        fxFlex="100"
      >
        <div fxFlex="100">
          <div class="break_word accountTitle">
            {{ subAccount?.subClass }}{{ subAccount?.basisName }}
          </div>
          <div style="width: 100%; margin-top: 2%">
            <div class="break_word sub_account_title">
              {{ subAccount?.subClassDesc }}
              {{ subAccount?.featureDescription }}
            </div>
          </div>
          <div fxLayout="row" class="applyBtnGrp">
            <div>
              <button
                mat-flat-button
                class="applyBtn"
                (click)="apply(subAccount)"
              >
                Apply
              </button>
            </div>
            <!-- <div class="learn_more">Learn More</div> -->
          </div>
        </div>
        <div fxFlex="48" class="deposit_service_img">
          <img
            [src]="getFileUrl(subAccount?.fileUrl)"
            width="399"
            height="333"
            alt="subAccountType"
          />
        </div>
      </div>
    </div>
  </div>
</div>
