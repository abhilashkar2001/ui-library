          <input
            matInput
            type="text"
            formControlName="amount"
            name="depositAmmount"
            [readonly]="!isEnabledEdit"
          />
        </mat-form-field>

      <div class="col-md-6 col-12">
        <mat-form-field
          appearance="outline"
          class="full-width"
          [ngClass]="isEnabledEdit == false && 'disableField'"
        >
          <mat-label>Maturity Date</mat-label>
          <input
            matInput
            type="text"
            formControlName="maturityDate"
            name="maturityDate"
            [matDatepicker]="picker"
            readonly
          />
          <mat-datepicker-toggle matSuffix [for]="picker">
            <mat-icon matDatepickerToggleIcon>calendar_today</mat-icon>
          </mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field
          appearance="outline"
          class="full-width"
          [ngClass]="isEnabledEdit == false && 'disableField'"
        >
          <mat-label>Interest Rate</mat-label>
          <input
            matInput
            type="text"
            formControlName="intrestRate"
            name="intrestRate"
            [readonly]="!isEnabledEdit"
          />
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field
          appearance="outline"
          class="full-width"
          [ngClass]="isEnabledEdit == false && 'disableField'"
        >
          <mat-label>Maturity Ammount</mat-label>
          <input
            matInput
            type="text"
            formControlName="maturityAmount"
            name="maturityAmount"
            [readonly]="!isEnabledEdit"
          />
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field
          appearance="outline"
          class="full-width"
          [ngClass]="isEnabledEdit == false && 'disableField'"
        >
          <mat-label>Deposit Holder Type</mat-label>
          <mat-select formControlName="ownership" [disabled]="!isEnabledEdit">
            <mat-option
              *ngFor="let ownership of ownership"
              [value]="ownership"
              >{{ ownership }}</mat-option
            >
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field
          appearance="outline"
          class="full-width"
          [ngClass]="isEnabledEdit == false && 'disableField'"
        >
          <mat-label>Customer Type</mat-label>
          <mat-select
            formControlName="typeOfCustomer"
            [disabled]="!isEnabledEdit"
          >
            <mat-option
              *ngFor="let typesOfCustomer of typesOfCustomer"
              [value]="typesOfCustomer"
              >{{ typesOfCustomer }}</mat-option
            >
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field
          appearance="outline"
          class="full-width"
          [ngClass]="isEnabledEdit == false && 'disableField'"
        >
          <mat-label>Payout Type</mat-label>
          <mat-select
            formControlName="intrestPayout"
            [disabled]="!isEnabledEdit"
          >
            <mat-option
              *ngFor="let interestPayout of interestPayout"
              [value]="interestPayout"
              >{{ interestPayout }}</mat-option
            >
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field
          appearance="outline"
          class="full-width"
          [ngClass]="isEnabledEdit == false && 'disableField'"
        >
          <mat-label>Payment Type</mat-label>
          <mat-select
            formControlName="paymentType"
            (selectionChange)="onPaymentTypeChange($event.value)"
            [disabled]="!isEnabledEdit"
          >
            <mat-option
              *ngFor="let paymentType of paymentType"
              [value]="paymentType"
              >{{ paymentType }}</mat-option
            >
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-checkbox formControlName="autoRenew">Auto Renew</mat-checkbox>
      </div>
    </div>
    <div fxFlex="100" fxLayout="row" fxLayoutGap="2%" style="margin-top: 50px">
      <div>
        <button
          type="button"
          mat-raised-button
          class="saveButton"
          (click)="submitCreateFd()"
          [disabled]="!createRdForm.valid"
        >
          Save
        </button>
      </div>
      <div>
        <button
          type="button"
          mat-raised-button
          class="cancelButton"
          (click)="onExit()"
        >
          Cancel
        </button>
      </div>
      <div>
        <button
          type="button"
          mat-raised-button
          class="cancelButton"
          (click)="editRecord()"
        >
          Edit
        </button>
      </div>
    </div>
  </form>
</div>
