<div fxFlex="100" fxLayout="column" style="padding: 2%">
  <app-landing-profile
    [imageUrl]="imageUrl"
    [profileHeader]="profileHeader"
    [profileHint]="profileHint"
    [routeUrl]="routeUrl"
  >
  </app-landing-profile>
  <div>
    <app-fd-rd-calculator
      (customDepositChange)="customDepositChange($event)"
    ></app-fd-rd-calculator>
  </div>
  <div fxLayout="column">
    <div fxLayoutAlign="center center" class="section_heading">
      Instant Growth {{ fdRdName }}
    </div>
    <div fxLayoutAlign="center center" class="section_subHeading">
      Maximize Your Savings with {{ fdRdFullName }} Deposit: Earn Guaranteed
      Returns on Your Investment.
    </div>
    <div style="margin: 2% 0%">
      <app-growth-fd-animation
        [depositName]="depositName"
      ></app-growth-fd-animation>
    </div>
  </div>
  <div class="mt-28">
    <app-deposit-faq></app-deposit-faq>
  </div>
  <div class="mt-70">
    <app-news-letter-slider></app-news-letter-slider>
  </div>
</div>
