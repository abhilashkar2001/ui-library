<div>
  <div
    fxLayout="row"
    fxLayoutAlign="start center"
    class="w-full"
    fxLayoutGap="10px"
  >
    <button (click)="goBack()" mat-icon-button>
      <mat-icon>arrow_back</mat-icon>
    </button>
    <label class="text-large">{{ "EFEC Conversion" }}</label>
  </div>
</div>

<mat-card>
  <form [formGroup]="eefcForm">
    <div fxLayout="row wrap" fxLayoutGap="2%">
      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="22"
      >
        <mat-label>Applicant Name</mat-label>
        <input matInput type="text" />
      </mat-form-field>

      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="22"
      >
        <mat-label>Customer Code</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="22"
      >
        <mat-label>Request Date</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="22"
      >
        <mat-label>EEFC Account</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="46"
      >
        <mat-label>Address Line1</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="46"
      >
        <mat-label>Address Line2</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="22"
      >
        <mat-label>Country</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="22"
      >
        <mat-label>Pin Code</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="22"
      >
        <mat-label>State</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="22"
      >
        <mat-label>City</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="22"
      >
        <mat-label>Currency Of Conversion</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="22"
      >
        <mat-label>Amount Of FCY To Be Converted</mat-label>
        <input matInput type="text" />
      </mat-form-field>

      <div fxFlex="22">
        <div
          fxLayout="column"
          class="middleAlign"
          fxLayoutAlign="space-between start"
        >
          <h4 class="mb-1 toggleText">{{ "EEFC Credit Account Type" }}</h4>
          <mat-radio-group
            class="full-width"
            fxLayout="row"
            fxLayoutGap="10%"
            aria-label="Select an option"
          >
            <mat-radio-button
              fxFlex="50"
              value="I"
              class="radioChecked radiobtn"
            >
              To Account to INR
            </mat-radio-button>
            <mat-radio-button
              fxFlex="40"
              value="E"
              class="radioChecked radiobtn"
              >to Account to EEFC</mat-radio-button
            >
          </mat-radio-group>
        </div>
      </div>
      <mat-form-field
        appearance="outline"
        class="fieldinput custom-field"
        fxFlex="50"
      >
        <mat-label>Select operative Account</mat-label>
        <input matInput type="text" />
      </mat-form-field>
    </div>
  </form>
</mat-card>

<div fxLayout="row wrap" fxLayout.lt-sm="column">
  <div fxFlex="100" fxLayoutAlign="end center">
    <!-- <div>
      <button
        class="exitButton"
        type="button"
        (click)="editRecord()"
        *ngIf="isEdit && !saveTheEdit"
        mat-raised-button
      >
        {{ "Edit" }}
      </button>
    </div> -->
    <button-loading (click)="onSubmit()"> Save</button-loading>&nbsp;&nbsp;
    <div>
      <button
        class="exitButton"
        type="button"
        (click)="goBack()"
        mat-raised-button
      >
        {{ "Cancel" }}
      </button>
    </div>
  </div>
</div>
