<mat-card class="full-width default-card mx-0">
  <div
    fxFlex="100"
    fxLayout="row wrap"
    fxLayoutAlign="space Between"
    fxLayoutGap="1%"
    class="applicantsInfo"
    [formGroup]="customerInfoForm"
  >
    <div fxLayout="column" fxFlex="24">
      <mat-label class="custom-label">Applicant Name</mat-label>
      <mat-form-field>
        <input matInput type="text" formControlName="applicantName" />
      </mat-form-field>
    </div>
    <div fxLayout="column" fxFlex="24">
      <mat-label class="custom-label">Customer Code</mat-label>
      <mat-form-field>
        <mat-select formControlName="customerCode">
          <mat-option value="abc">ABC</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div fxLayout="column" fxFlex="24">
      <mat-label class="custom-label">Issuing Branch</mat-label>
      <mat-form-field>
        <mat-select formControlName="issuingBranch">
          <mat-option value="abc">ABC</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div fxLayout="column" fxFlex="24">
      <mat-label class="custom-label">Bill Type</mat-label>
      <mat-radio-group
        fxLayout="row"
        class="domesticToggle"
        formControlName="billType"
      >
        <mat-radio-button value="LCY packing" class="custom-label"
          >Packing(LCY)</mat-radio-button
        >
        <mat-radio-button value="FCY packing" class="custom-label"
          >Packing(FCY)</mat-radio-button
        >
      </mat-radio-group>
    </div>
    <ng-container
      *ngFor="let address of addressControle.controls; let i = index"
      [formGroup]="address"
    >
      <div fxLayout="column" fxFlex="49">
        <mat-label class="custom-label">Address line 1</mat-label>
        <mat-form-field>
          <input matInput type="text" formControlName="address1" />
        </mat-form-field>
      </div>

      <div fxLayout="column" fxFlex="49">
        <mat-label class="custom-label">Address line 2</mat-label>
        <mat-form-field>
          <input matInput type="text" formControlName="address2" />
        </mat-form-field>
      </div>

      <div fxLayout="column" fxFlex="24">
        <app-searchable-select
          [items]="countryArr"
          inputLabel="Country"
          bindLabelKey="countryName"
          bindValueKey="countryName"
          [control]="address.get('countryName')"
          (selectionChange)="onChangeCountry(i)"
          showOutsideLabel="true"
        ></app-searchable-select>
      </div>
      <div fxLayout="column" fxFlex="24">
        <mat-label class="custom-label">zip Code</mat-label>
        <mat-form-field class="full-width disable-field zipCode_field">
          <input
            matInput
            type="text"
            formControlName="pincode"
            name="pincode"
            numbersOnly
            maxlength="10"
          />
          <mat-icon
            matSuffix
            class="searchIcon-main"
            (click)="pincodeExpansion(i, address)"
            >search</mat-icon
          >
        </mat-form-field>
      </div>

      <div fxLayout="column" fxFlex="24">
        <mat-label class="custom-label">State</mat-label>
        <mat-form-field>
          <input matInput type="text" formControlName="stateName" />
        </mat-form-field>
      </div>

      <div fxLayout="column" fxFlex="24">
        <mat-label class="custom-label">City</mat-label>
        <mat-form-field>
          <input matInput type="text" formControlName="cityName" />
        </mat-form-field>
      </div>
    </ng-container>
    <div fxLayout="column" fxFlex="24">
      <mat-label class="custom-label">IEC Code</mat-label>
      <mat-form-field>
        <input matInput type="text" formControlName="IecCode" />
      </mat-form-field>
    </div>
    <div fxFlex="24">
      <mat-label class="custom-label">Date Of Shipment</mat-label>
      <mat-form-field appearance="outline">
        <mat-datepicker-toggle
          class="date-toggle"
          matSuffix
          [for]="picker1"
        ></mat-datepicker-toggle>
        <mat-datepicker #picker1></mat-datepicker>
        <input
          matInput
          readonly
          [matDatepicker]="picker1"
          class="date-picker"
          formControlName="dateOfShipment"
        />
      </mat-form-field>
    </div>
    <div fxLayout="column" fxFlex="24">
      <mat-label class="custom-label">Bill Amount</mat-label>
      <mat-form-field>
        <input matInput type="text" formControlName="billAmount" />
      </mat-form-field>
    </div>
    <div fxFlex="24">
      <mat-label class="custom-label">Due Date</mat-label>
      <mat-form-field appearance="outline">
        <mat-datepicker-toggle
          class="date-toggle"
          matSuffix
          [for]="picker2"
        ></mat-datepicker-toggle>
        <mat-datepicker #picker2></mat-datepicker>
        <input
          matInput
          readonly
          [matDatepicker]="picker2"
          class="date-picker"
          formControlName="dueDate"
        />
      </mat-form-field>
    </div>
    <div fxLayout="column" fxFlex="24">
      <mat-label class="custom-label">Bill Referenance No.</mat-label>
      <mat-form-field>
        <input matInput type="text" formControlName="billReferenanceNo" />
        <mat-icon matSuffix class="searchIcon-main">search</mat-icon>
      </mat-form-field>
    </div>
    <div fxLayout="column" fxFlex="24">
      <mat-label class="custom-label">Tenor</mat-label>
      <mat-form-field>
        <input matInput type="text" formControlName="tenor" />
      </mat-form-field>
    </div>
    <div fxLayout="column" fxFlex="24">
      <mat-label class="custom-label">Fee Amount</mat-label>
      <mat-form-field>
        <mat-select formControlName="feeAmount">
          <mat-option value="abc">ABC</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
</mat-card>
