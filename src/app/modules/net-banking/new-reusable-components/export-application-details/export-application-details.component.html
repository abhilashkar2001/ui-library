<mat-card>
  <div
    fxLayout="column"
    [formGroup]="applicationProcess"
    class="exportsappinfo"
  >
    <div fxLayout="row" fxLayoutGap="10">
      <mat-form-field appearance="outline" fxFlex="24.5">
        <mat-label>Applicant name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>
      <app-searchable-select
        fxFlex="24.5"
        inputLabel="Customer Code"
        [control]="applicationProcess.get('customerCode')"
      ></app-searchable-select>
    </div>
    <div fxLayout="row" fxLayoutGap="10">
      <mat-form-field appearance="outline">
        <mat-label>Address line 1</mat-label>
        <input matInput formControlName="address1" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Address line 2</mat-label>
        <input matInput formControlName="address2" />
      </mat-form-field>
    </div>
    <div fxLayout="row" fxLayoutGap="10">
      <app-searchable-select
        fxFlex="24.5"
        inputLabel="Country"
        [control]="applicationProcess.get('country')"
      ></app-searchable-select>
      <mat-form-field appearance="outline" fxFlex="24.5">
        <mat-label>Pin Code</mat-label>
        <input matInput formControlName="pinCode" />
        <mat-icon matSuffix class="searchIcon-main">search</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline" fxFlex="24.5">
        <mat-label>State</mat-label>
        <input matInput formControlName="state" />
      </mat-form-field>
      <mat-form-field appearance="outline" fxFlex="24.5">
        <mat-label>City</mat-label>
        <input matInput formControlName="city" />
      </mat-form-field>
    </div>
    <div fxLayout="row" fxLayoutGap="10">
      <mat-form-field appearance="outline" fxFlex="24.5">
        <mat-label>IEC Code</mat-label>
        <input matInput formControlName="iecCode" />
      </mat-form-field>
      <mat-form-field appearance="outline" fxFlex="24.5">
        <mat-label>Applicant reference</mat-label>
        <input matInput formControlName="reference" />
      </mat-form-field>
    </div>
  </div>
</mat-card>
