<div [formGroup]="billSectionBForm">
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
        <div fxFlex="100" fxFlex.gt-xs="24">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Date From</mat-label>
                <input matInput type="text" formControlName="dateFrom" />
                <mat-datepicker-toggle matSuffix [for]="picker">
                    <mat-icon matDatepickerToggleIcon>
                      <img src="/assets/images/calendar.png" class="pb-25" />
                    </mat-icon>
                  </mat-datepicker-toggle>
                  <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
        </div>
        <div fxFlex="100" fxFlex.gt-xs="24">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Date To</mat-label>
                <input matInput type="text" formControlName="dateTo" />
                <mat-datepicker-toggle matSuffix [for]="picker">
                    <mat-icon matDatepickerToggleIcon>
                      <img src="/assets/images/calendar.png" class="pb-25" />
                    </mat-icon>
                  </mat-datepicker-toggle>
                  <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
        </div>
        <div fxFlex="100" fxFlex.gt-xs="24">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Softex No</mat-label>
                <input matInput type="text" formControlName="country" />
            </mat-form-field>
        </div>
        <div fxFlex="100" fxFlex.gt-xs="24">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Dealer Branch</mat-label>
                <input matInput type="text" formControlName="dealerBranch" />
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
        </div>
    </div>
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
        <div fxFlex="100" fxFlex.gt-xs="24">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Dealer Code</mat-label>
                <mat-select formControlName="dealerCode" >
                    <mat-option *ngFor="let item of customerCodesList" value="item.value">{{item.label}}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div fxFlex="100" fxFlex.gt-xs="24">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Internal Project Code</mat-label>
                <input matInput type="text" formControlName="internalProjectCode" />
            </mat-form-field>
        </div>
        <div fxFlex="100" fxFlex.gt-xs="24">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Internal Project Date</mat-label>
                <input matInput type="text" formControlName="internalProjectDate" />
                <mat-datepicker-toggle matSuffix [for]="picker">
                    <mat-icon matDatepickerToggleIcon>
                      <img src="/assets/images/calendar.png" class="pb-25" />
                    </mat-icon>
                  </mat-datepicker-toggle>
                  <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
        </div>
        <div fxFlex="100" fxFlex.gt-xs="24">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Type of S/W Exported</mat-label>
                <input matInput type="text" formControlName="typeofExported" />
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
        </div>
    </div>
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
        <div fxFlex="100" fxFlex.gt-xs="49">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Address line 1*</mat-label>
                <input matInput type="text" formControlName="address1" />
            </mat-form-field>
        </div>
        <div fxFlex="100" fxFlex.gt-xs="49">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Address line 2</mat-label>
                <input matInput type="text" formControlName="address2" />
            </mat-form-field>
        </div>
    </div>
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
        <div fxFlex="100" fxFlex.gt-xs="24">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Country*</mat-label>
                <input matInput type="text" formControlName="country" />
            </mat-form-field>
        </div>
        <div fxFlex="100" fxFlex.gt-xs="24">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Pin Code*</mat-label>
                <input matInput type="text" formControlName="pincode" />
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
        </div>
        <div fxFlex="100" fxFlex.gt-xs="24">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>State*</mat-label>
                <input matInput type="text" formControlName="state" />
            </mat-form-field>
        </div>
        <div fxFlex="100" fxFlex.gt-xs="24">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>City*</mat-label>
                <input matInput type="text" formControlName="city" />
            </mat-form-field>
        </div>
    </div>
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
        <div fxFlex="100" fxFlex.gt-xs="49">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Mode of Realization *</mat-label>
                <mat-select formControlName="realization" >
                    <mat-option *ngFor="let item of customerCodesList" value="item.value">{{item.label}}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </div>
</div>
