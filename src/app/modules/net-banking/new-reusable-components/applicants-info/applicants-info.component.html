<mat-card class="full-width default-card mx-0">
  <div
    fxFlex="100"
    fxLayout="row wrap"
    fxLayoutAlign="space Between"
    fxLayoutGap="2%"
    class="applicantsInfo"
    [formGroup]="applicantForm"
  >
    <mat-form-field fxFlex="23">
      <mat-label>Applicant</mat-label>
      <input matInput type="text" formControlName="applicant" />
    </mat-form-field>
    <mat-form-field fxFlex="23">
      <mat-label>Issuing Branch</mat-label>
      <input matInput type="text" formControlName="issuingBranchCode" />
    </mat-form-field>
    <mat-form-field fxFlex="23">
      <mat-label>Delivery Branch</mat-label>
      <input matInput type="text" formControlName="deliveryBranchCode" />
    </mat-form-field>
    <mat-form-field fxFlex="23">
      <mat-label>Applicant References</mat-label>
      <input matInput type="text" formControlName="applicantReferences" />
    </mat-form-field>
    <ng-container
      *ngFor="let address of addressControle.controls; let i = index"
      [formGroup]="address"
    >
      <mat-form-field fxFlex="48">
        <mat-label>Address line 1</mat-label>
        <input matInput type="text" formControlName="address2" />
      </mat-form-field>
      <mat-form-field fxFlex="48">
        <mat-label>Address line 2</mat-label>
        <input matInput type="text" formControlName="address2" />
      </mat-form-field>
      <div fxFlex="23">
        <app-searchable-select
          [items]="countryArr"
          inputLabel="Country"
          bindLabelKey="countryName"
          bindValueKey="countryName"
          [control]="address.get('countryName')"
          (selectionChange)="onChangeCountry(i)"
        ></app-searchable-select>
      </div>
      <mat-form-field
        fxFlex="23"
        class="full-width disable-field zipCode_field mt-2"
      >
        <mat-label>Pin Code</mat-label>
        <input
          matInput
          type="text"
          formControlName="pincode"
          name="pincode"
          numbersOnly
          maxlength="10"
        />
        <mat-icon
          matSuffix
          class="searchIcon-main"
          (click)="pincodeExpansion(i, address)"
          >search</mat-icon
        >
      </mat-form-field>
      <mat-form-field fxFlex="23">
        <mat-label>State</mat-label>
        <input matInput type="text" formControlName="stateName" />
      </mat-form-field>
      <mat-form-field fxFlex="23">
        <mat-label>City</mat-label>
        <input matInput type="text" formControlName="cityName" />
      </mat-form-field>
    </ng-container>
    <mat-form-field fxFlex="23">
      <mat-label>Delivery Mode</mat-label>
      <input matInput type="text" formControlName="deliveryMode" />
    </mat-form-field>
    <mat-form-field fxFlex="23">
      <mat-label>Fee Account</mat-label>
      <mat-select formControlName="feeAccount">
        <mat-option *ngFor="let item of feeAccArray" [value]="item">{{
          item
        }}</mat-option>
      </mat-select>
    </mat-form-field>
    <h3 class="noteClass">
      Note: The bank has the discretion to modify the limit, Margin %, Margin
      type details provided as the part of the request
    </h3>
  </div>
</mat-card>
