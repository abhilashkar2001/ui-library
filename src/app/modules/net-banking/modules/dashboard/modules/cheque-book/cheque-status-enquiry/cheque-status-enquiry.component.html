<div class="cheque-status_container">
  <form [formGroup]="chqueInquiryForm" fxFlex="100" fxLayout="column">
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="20">
      <mat-label class="ml-20 custom-label">Account No</mat-label>
      <ic-select
        fxFlex="30"
        label="No of Leaves Per Book*"
        [control]="chqueInquiryForm.get('accountNo') | formcontrol"
        [options]="accountNumberList"
        [bindValueKey]="'accountNo'"
        (selectionChange)="handleAccountNumberChange()"
        [bindLabelKey]="'accountNo'"
        selectionType="single"
      >
      </ic-select>
      <span class="message" *ngIf="chequeNumber"
        >{{ customerInfo?.accounts?.[0]?.accountType }} | Name:
        {{ customerInfo?.customerName }}</span
      >
    </div>

    <h3 class="wrapper_row light-blue-title">Cheque Book Detail</h3>
    <div class="row wrapper_row" fxLayout="column" fxLayoutGap="20">
      <div fxFlex="100">
        <div fxLayout="column" fxLayoutGap="20">
          <mat-label class="mb-8 custom-label">{{ 'Account' }}</mat-label>
          <mat-radio-group
            fxLayoutGap="20"
            [formControl]="
              chqueInquiryForm.get('inquiryChequeBy') | formcontrol
            "
          >
            <mat-radio-button
              *ngFor="let option of inquiryChequeOptions"
              [value]="option?.value"
              >{{ option?.label }}</mat-radio-button
            >
          </mat-radio-group>
        </div>
      </div>
    </div>
    <div fxFlex="100" fxLayoutAlign="space-between center" class="row px-12">
      <div
        fxFlex="30"
        *ngIf="chqueInquiryForm.get('inquiryChequeBy')?.value === 'Number'"
      >
        <!-- <app-ic-custom-input
          [control]="chqueInquiryForm.get('chequeNumber') | formcontrol"
          inputLabel="Cheque Number"
        ></app-ic-custom-input> -->
        <ic-form-field
          placeholder="Cheque Number"
          [control]="chqueInquiryForm.get('chequeNumber') | formcontrol"
          [label]="'Cheque Number'"
        ></ic-form-field>
      </div>

      <div
        fxFlex="30"
        *ngIf="chqueInquiryForm.get('inquiryChequeBy')?.value === 'Status'"
      >
        <ic-select
          label="No of Leaves Per Book*"
          [control]="chqueInquiryForm.get('select') | formcontrol"
          [options]="selectList"
          [bindValueKey]="'value'"
          [bindLabelKey]="'label'"
          selectionType="single"
        >
        </ic-select>
      </div>

      <ng-container
        *ngIf="chqueInquiryForm.get('inquiryChequeBy')?.value === 'Range'"
      >
        <div fxFlex="25">
          <!-- <app-ic-custom-input
            [control]="chqueInquiryForm.get('fromChequeBookNo') | formcontrol"
            inputLabel="From Cheque Book No"
          ></app-ic-custom-input> -->
          <ic-form-field
            placeholder="From Cheque Book No"
            [control]="chqueInquiryForm.get('fromChequeBookNo') | formcontrol"
            [label]="'From Cheque Book No'"
          ></ic-form-field>
        </div>
        <div fxFlex="25">
          <!-- <app-ic-custom-input
            [control]="chqueInquiryForm.get('toChequeBookNo') | formcontrol"
            inputLabel="To Cheque Book No"
          ></app-ic-custom-input> -->
          <ic-form-field
            placeholder="To Cheque Book No"
            [control]="chqueInquiryForm.get('toChequeBookNo') | formcontrol"
            [label]="'To Cheque Book No'"
          ></ic-form-field>
        </div>
      </ng-container>

      <div fxFlex="40" fxLayoutGap="20" class="d-flex">
        <button mat-raised-button class="exit-button" (click)="goBack()">
          {{ 'Cancel' }}
        </button>
        <ic-button
          (click)="fetchChequeDetails()"
          label="Proceed"
          icButtonType="filled-rounded"
          type="submit"
          size="large"
        ></ic-button>
      </div>
    </div>
  </form>
</div>

<!-- Summary table for fetched cheque data -->
<div class="table" *ngIf="fetchedData">
  <app-reusable-table
    [columnNames]="chequeStatusCols"
    [data]="chequeStatusData"
  ></app-reusable-table>
</div>
