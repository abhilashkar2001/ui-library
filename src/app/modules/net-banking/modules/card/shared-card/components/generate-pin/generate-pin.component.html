<h2 mat-dialog-title class="verification generate_pin_header">
  {{ 'Set New ATM PIN' }}
</h2>
<mat-dialog-content>
  <mat-card
    fxLayout="column"
    fxLayoutAlign="space-between center"
    class="default generate_pin_card mx-auto d-flex flex-column"
  >
    <span class="text-light">Enter New ATM PIN <strong>(4 digit)</strong></span>
    <!-- <input matInput /> -->
    <ic-form-field></ic-form-field>
    <div class="otp_block">
      <ng-otp-input
        class="ng_otp_input"
        #newPin
        (onInputChange)="onOtpChange($event)"
        [config]="newPinConfig"
      ></ng-otp-input>
      <div
        class="view_pin_btn"
        (click)="toggleNewPinView()"
        (keydown.enter)="toggleNewPinView()"
        tabindex="0"
      >
        View PIN
      </div>
    </div>
    <span class="text-light">Confirm ATM PIN <strong>(4 digit)</strong></span>
    <div class="otp_block">
      <ng-otp-input
        class="ng_otp_input"
        #ngOtpInput
        (onInputChange)="onOtpChange($event)"
        [config]="confPinConfig"
      ></ng-otp-input>
      <div
        class="view_pin_btn"
        (click)="toggleConfPinView()"
        (keydown.enter)="toggleConfPinView()"
        tabindex="1"
      >
        View PIN
      </div>
    </div>

    <div
      class="button_section"
      fxLayout="row"
      fxLayoutGap="20"
      fxLayoutAlign="center"
      mat-dialog-actions
    >
      <ic-button
        label="Cancel"
        icButtonType="outlined"
        type="submit"
        size="large"
        (click)="cancel()"
      ></ic-button>
      <ic-button
        label="Subscription"
        (click)="submit()"
        icButtonType="filled"
        type="submit"
        size="large"
      ></ic-button>
    </div>
  </mat-card>
</mat-dialog-content>
