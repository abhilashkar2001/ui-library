<form *ngIf="reloadForm" [formGroup]="reloadForm" fxLayout="column">
  <h3 class="light-blue-title">Reload</h3>
  <mat-card fxLayout="column">
  <div fxFlex="100" class="mb-8">
    <app-ic-radio-button
      [optiions]="prepaidRegister"
      [control]="reloadForm.get('prepaidRegister')"
    ></app-ic-radio-button>
  </div>
  <div
    class="row wrapper_row"
    *ngIf="
      reloadForm.get('prepaidRegister').value == false;
      else showRegisterPrepaid
    "
  >
    <div fxFlex="25" class="input_wrapper">
      <app-ic-custom-input
        [control]="reloadForm.get('cardNumber')"
        [inputLabel]="'Card Number' | translate"
      ></app-ic-custom-input>
    </div>
    <div fxFlex="25" class="input_wrapper">
      <app-ic-custom-input
        [control]="reloadForm.get('confirmCardNo')"
        [inputLabel]="'Confirm Card Number' | translate"
      ></app-ic-custom-input>
    </div>
    <div fxFlex="25" class="input_wrapper">
      <app-ic-custom-input
        [control]="reloadForm.get('cvv')"
        [inputLabel]="'Enter CVV' | translate"
      ></app-ic-custom-input>
    </div>
    <div fxFlex="25" class="input_wrapper">
      <app-ic-custom-input
        [control]="reloadForm.get('nickName')"
        [inputLabel]="'Nick Name' | translate"
      ></app-ic-custom-input>
    </div>
  </div>
  <ng-template #showRegisterPrepaid>
    <div fxLayout="row" fxFlex="100" fxLayoutGap="10">
      <div fxLayout="column" class="blue-box" fxFlex="100">
        <span class="light-blue-title">{{ "Pay From" | translate }}</span>
        <div fxLayout="column">
          <app-ic-custom-pay-from
            [control]="reloadForm.get('payFrom')"
            [inputLabel]="'Account No' | translate"
            bindValueKey="accountNo"
            bindLabelKey="accountNo"
            message="Saving Account | Balance:$20"
          ></app-ic-custom-pay-from>
        </div>
      </div>
      <div fxLayout="column" class="blue-box" fxFlex="100">
        <span class="light-blue-title">{{ "Credit Card" | translate }}</span>
        <div fxLayout="row">
          <app-ic-custom-pay-from
            [control]="reloadForm.get('cardNumber')"
            [inputLabel]="'Card No' | translate"
            bindValueKey="cardNumber"
            bindLabelKey="cardNumber"
            [items]="cardList"
            (selectionChange)="selectedCard($event)"
          ></app-ic-custom-pay-from>
          <div
            fxLayout="column"
            fxLayoutAlign="center center"
            class="label-info m-12"
          >
            <span class="label-info">
              {{ "Credit card" | translate }} | {{ "Name" | translate }} -
              {{ typeofCard }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
  <div class="light-blue-title row">
    {{ "Payment Details" | translate }}
  </div>
  <div fxFlex="100" class="mt-8">
    <app-ic-radio-button
      [optiions]="setUpPayment"
      [control]="reloadForm.get('setUpPayment')"
      [displayLabel]="'Setup Recurring Payment for this Biller' | translate"
      layout="column"
    ></app-ic-radio-button>
  </div>
  <div fxLayout="column" *ngIf="reloadForm.get('prepaidRegister').value == false">
    <app-ic-custom-pay-from
      [control]="reloadForm.get('payFrom')"
      [inputLabel]="'Pay From' | translate"
      bindValueKey="accountNo"
      bindLabelKey="accountNo"
      message="Saving Account | Balance:$20"
    ></app-ic-custom-pay-from>
  </div>
  <div class="row wrapper_row">
    <div fxFlex="25" class="input_wrapper">
      <app-ic-custom-input
        [control]="reloadForm.get('currencyCode')"
        customClass="customTotalField"
        customLabelClass="customLabelClass"
        [inputLabel]="'Currency' | translate"
        [readonly]="true"
      ></app-ic-custom-input>
    </div>
    <div fxFlex="25" class="input_wrapper">
      <app-ic-custom-amount-input
        [inputLabel]="'Payment Amount' | translate"
        [currencyCode]="reloadForm.get('currencyCode').value"
        [control]="reloadForm.get('paymentAmount')"
      ></app-ic-custom-amount-input>
    </div>
  </div>
  <div class="row wrapper_row">
    <div fxFlex="25" class="input_wrapper">
      <app-input-date-picker
        [control]="reloadForm.get('schedulePayment')"
        [inputLabel]="'Schedule Payment' | translate"
        [showOutsideLabel]="true"
      ></app-input-date-picker>
    </div>
    <div fxFlex="25" class="input_wrapper">
      <app-searchable-select
        [items]="genericValue?.SCHEDULEPAYMENT"
        [control]="reloadForm.get('frequency')"
        [inputLabel]="'Frequency' | translate"
        bindLabelKey="values"
        bindValueKey="values"
        [showOutsideLabel]="true"
      ></app-searchable-select>
    </div>
    <div fxFlex="25" class="input_wrapper">
      <app-ic-custom-input
        [control]="reloadForm.get('noOfInstallments')"
        [inputLabel]="'No of installments' | translate"
      ></app-ic-custom-input>
    </div>
    <div fxFlex="25" class="input_wrapper">
      <app-ic-custom-input
        [control]="reloadForm.get('remarks')"
        [inputLabel]="'Remarks' | translate"
      ></app-ic-custom-input>
    </div>
  </div>
  <div fxLayoutGap="20" fxLayoutAlign="end center">
      <app-ic-action-button buttonName="Cancel" buttonType="stroked">
      </app-ic-action-button>
      <app-ic-action-button
        buttonName="Proceed"
        buttonType="filled"
        (onClick)="proceed()"
      ></app-ic-action-button>
    </div>
    </mat-card>
</form>
