<form *ngIf="refundForm" [formGroup]="refundForm" fxLayout="column">
  <div fxLayout="row" fxFlex="100" fxLayoutGap="10">
    <div fxLayout="column" class="blue-box" fxFlex="100">
      <span class="light-blue-title">{{ "Pay From" | translate }}</span>
      <div fxLayout="column">
        <app-ic-custom-pay-from
          [control]="refundForm.get('transferTo')"
          [inputLabel]="'Account No' | translate"
          bindValueKey="accountNo"
          bindLabelKey="accountNo"
          message="Saving Account | Balance:$20"
        ></app-ic-custom-pay-from>
      </div>
    </div>
    <div fxLayout="column" class="blue-box" fxFlex="100">
      <span class="light-blue-title">{{ "Credit Card" | translate }}</span>
      <div fxLayout="row">
        <app-ic-custom-pay-from
          [control]="refundForm.get('fromPrepaidCard')"
          [inputLabel]="'Card No' | translate"
          bindValueKey="cardNumber"
          bindLabelKey="cardNumber"
          [items]="cardList"
          (selectionChange)="fetchCardDetails($event)"
        ></app-ic-custom-pay-from>
        <div
          fxLayout="column"
          fxLayoutAlign="center center"
          class="label-info m-12"
        >
          <span class="label-info">
            {{ "Credit card" | translate }} | {{ "Name" | translate }} -
            {{ typeofCard }}
          </span>
        </div>
      </div>
    </div>
  </div>
  <div fxLayout="column" class="blue-border p-12 mt-8 mb-8">
    <span class="light-blue-title">{{ "Currency" | translate }}</span>
    <mat-divider></mat-divider>
    <app-reusable-table
      [columnNames]="viewColumnData"
      [data]="cardDetails"
    ></app-reusable-table>
  </div>
</form>
