<form [formGroup]="alertSubscriptionForm">
  <div fxFlex="100" fxLayoutGap="10">
    <div fxLayout="column" class="blue-box" fxFlex="100">
      <span class="light-blue-title">{{ "Credit Card" | translate }}</span>
      <div fxLayout="row">
        <app-ic-custom-pay-from
          [control]="alertSubscriptionForm.get('creditAccount')"
          [inputLabel]="'Card No' | translate"
          bindValueKey="cardNumber"
          bindLabelKey="cardNumber"
          [items]="cardList"
          (selectionChange)="patchDetails($event)"
        ></app-ic-custom-pay-from>
        <div
          fxLayout="column"
          fxLayoutAlign="center center"
          class="label-info m-12"
        >
          <span class="label-info">
            {{ "Credit card" | translate }} | {{ "Name" | translate }} -
            {{ typeofCard }}
          </span>
        </div>
      </div>
    </div>
    <div fxFlex="50" class="alert-card-section">
      <div fxLayout="row" fxLayoutGap="10">
        <div
          fxLayout="column"
          fxFlex="33"
          *ngFor="let item of alertData; let detIndx = index"
        >
          <div class="alert-card-titel">{{ item?.label | translate }}</div>
          <div class="alert-card-details">
            {{ accountDetails?.[item?.key] }}
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
