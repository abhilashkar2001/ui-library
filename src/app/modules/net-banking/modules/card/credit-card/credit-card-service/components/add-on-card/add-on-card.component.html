<div [formGroup]="addonCardForm" fxLayout="column">
  <div fxLayout="row">
    <div fxLayout="column" class="blue-box" fxFlex="100">
      <span class="light-blue-title">{{ "Credit Card" | translate }}</span>
      <div fxLayout="row">
        <app-ic-custom-pay-from
          [control]="addonCardForm.get('cardNumber')"
          [inputLabel]="'Card No' | translate"
          bindValueKey="cardNumber"
          bindLabelKey="cardNumber"
          [items]="cardList"
          (selectionChange)="patchDetails($event)"
        ></app-ic-custom-pay-from>
        <div
          fxLayout="column"
          fxLayoutAlign="center center"
          class="label-info m-12"
        >
          <span class="label-info">
            {{ "Credit card" | translate }} | {{ "Name" | translate }} -
            {{ typeofCard }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <h3 class="light-blue-title">{{ "Request Add-On" | translate }}</h3>
  <div>
    <div fxFlex="25" class="input_wrapper">
      <app-ic-custom-input
        [control]="addonCardForm.get('nameRequired')"
        [inputLabel]="'Name Required' | translate"
      ></app-ic-custom-input>
    </div>
    <div fxFlex="25" class="input_wrapper">
      <app-input-date-picker
        [control]="addonCardForm.get('dateOfBirth')"
        [inputLabel]="'Date of Birth' | translate"
      ></app-input-date-picker>
    </div>
    <div fxFlex="25" class="input_wrapper">
      <app-searchable-select
        [items]="items"
        [control]="addonCardForm.get('relationShip')"
        [inputLabel]="'Relationship' | translate"
        bindLabelKey="label"
        bindValueKey="value"
      ></app-searchable-select>
    </div>
  </div>
</div>
