<form [formGroup]="billingCycleForm">
  <div
    fxFlex="100"
    fxLayout="row"
    fxLayoutGap="10"
    fxLayoutAlign="space-between center"
  >
    <div fxLayout="column" class="blue-box" fxFlex="100">
      <span class="light-blue-title">{{ "Credit Card" | translate }}</span>
      <div fxLayout="row">
        <app-ic-custom-pay-from
          [control]="billingCycleForm.get('cardNo')"
          [inputLabel]="'Card No' | translate"
          bindValueKey="cardNumber"
          bindLabelKey="cardNumber"
          [items]="cardList"
          (selectionChange)="patchDetails($event)"
        ></app-ic-custom-pay-from>
        <div
          fxLayout="column"
          fxLayoutAlign="center center"
          class="label-info m-12"
        >
          <span class="label-info">
            {{ "Credit card" | translate }} | {{ "Name" | translate }} -
            {{ typeofCard }}
          </span>
        </div>
      </div>
    </div>
    <div fxFlex="24.5">
      <app-ic-custom-input
        [control]="billingCycleForm.get('billingCycleDate')"
        [inputLabel]="'Current Billing cycle' | translate"
        [readonly]="true"
      ></app-ic-custom-input>
    </div>
    <div fxFlex="24.5">
      <div fxFlex="100" fxLayout="column">
        <mat-label>{{ "Request Bill Cycle*" | translate }}</mat-label>
        <mat-form-field>
          <mat-select formControlName="requestDate">
            <mat-option *ngFor="let i of billingCycleList" [value]="i?.value">
              {{ i?.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </div>
</form>
<div fxLayoutGap="20" fxLayoutAlign="end center">
  <app-ic-action-button buttonName="Cancel" buttonType="stroked">
  </app-ic-action-button>
  <app-ic-action-button
    buttonName="Proceed"
    buttonType="filled"
    (onClick)="proceed()"
  ></app-ic-action-button>
</div>
