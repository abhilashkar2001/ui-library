<form [formGroup]="billingCycleForm" fxLayout="column">
  <h3 class="light-blue-title">Billing Cycle</h3>
  <mat-card fxLayout="column">
    <div
      fxFlex="100"
      fxLayout="row"
      fxLayoutGap="10"
      fxLayoutAlign="space-between center"
    >
      <div fxLayout="column" class="blue-box" fxFlex="100">
        <span class="light-blue-title">{{ 'Credit Card' | translate }}</span>
        <div fxLayout="row">
          <app-ic-custom-pay-from
            [control]="billingCycleForm.get('cardNo') | formcontrol"
            [inputLabel]="'Card No' | translate"
            bindValueKey="cardNumber"
            bindLabelKey="cardNumber"
            [items]="cardList"
            (selectionChange)="patchDetails($event)"
          ></app-ic-custom-pay-from>
          <div
            fxLayout="column"
            fxLayoutAlign="center center"
            class="label-info m-12"
          >
            <span class="label-info">
              {{ 'Credit card' | translate }} | {{ 'Name' | translate }} -
              {{ typeofCard }}
            </span>
          </div>
        </div>
      </div>
      <div fxFlex="24.5">
        <ic-form-field
          [readonly]="true"
          placeholder="Current Billing cycle"
          [control]="billingCycleForm.get('billingCycleDate') | formcontrol"
          [label]="'Current Billing cycle' | translate"
        ></ic-form-field>
      </div>
      <div fxFlex="24.5">
        <div fxFlex="100" fxLayout="column">
          <ic-select
            class="card-algn"
            [label]="'Request Bill Cycle*' | translate"
            placeholder="Request Bill Cycle*"
            [options]="billingCycleList"
            [bindValueKey]="'value'"
            [bindLabelKey]="'label'"
            [control]="billingCycleForm.get('requestDate') | formcontrol"
          ></ic-select>
        </div>
      </div>
    </div>
    <div fxLayoutGap="20" fxLayoutAlign="end center">
      <ic-button
        [label]="'Cancel'"
        icButtonType="outlined"
        type="submit"
        size="large"
      ></ic-button>
      <ic-button
        label="Proceed"
        (click)="proceed()"
        icButtonType="filled"
        type="submit"
        size="large"
      ></ic-button>
    </div>
  </mat-card>
</form>
