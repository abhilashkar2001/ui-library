<mat-card>
  <form
    [formGroup]="increaseLimitForm"
    fxLayout="column"
    fxLayoutGap="10px"
    class="mainDiv"
  >
    <div fxLayout="row" fxLayoutGap="10" fxLayoutAlign="space-between center">
      <div fxFlex="50" fxLayoutGap="10" fxLayoutAlign="center center">
        <div class="row card-algn" fxFlex="50">
          <ic-select
            label="Card Number"
            [control]="increaseLimitForm.get('cardNo') | formcontrol"
            (selectionChange)="getCreditCardLimitByNo($event)"
            placeholder="Card Number"
            [options]="creditCardList"
            bindValueKey="cardNo"
            bindLabelKey="cardValue"
            selectionType="single"
          >
          </ic-select>
        </div>
        <div class="row" fxFlex="50">
          <app-ic-custom-input
            [control]="
              increaseLimitForm.get('eligibleCreditLimit') | formcontrol
            "
            [inputLabel]="'Eligible Credit Limit' | translate"
            [country]="selectedCurrency"
            customClass="customTotalField"
            customLabelClass="customLabelClass"
            [readonly]="true"
          ></app-ic-custom-input>
          <!-- <ic-form-field
            placeholder="Eligible Credit Limit"
            [control]="
              increaseLimitForm.get('eligibleCreditLimit') | formcontrol
            "
            [label]="'Eligible Credit Limit' | translate"
            [readonly]="true"
          ></ic-form-field> -->
        </div>
      </div>
      <div fxLayoutGap="20" fxLayoutAlign="end center">
        <!-- <app-ic-action-button
          [buttonName]="'Cancel' | translate"
          buttonType="stroked"
        >
        </app-ic-action-button>
        <app-ic-action-button
          [buttonName]="'Proceed' | translate"
          buttonType="filled"
          (onClick)="proceedToOtp()"
          [disabled]="!increaseLimitForm.get('eligibleCreditLimit')?.value"
        ></app-ic-action-button> -->
        <ic-button
          label="Cancel"
          icButtonType="outlined"
          type="submit"
          size="large"
        ></ic-button>
        <ic-button
          label="Proceed"
          [disabled]="!increaseLimitForm.get('eligibleCreditLimit')?.value"
          (click)="proceedToOtp()"
          icButtonType="filled"
          type="submit"
          size="large"
        ></ic-button>
      </div>
    </div>
    <ng-container *ngIf="viewOtp">
      <mat-divider></mat-divider>
      <span class="otp-Disclamer"
        >{{
          'You will receive an OTP on your registered mobile number' | translate
        }}
        *******{{ fourDigitNo }} /
        {{ 'email ID. Please enter the same to continue.' | translate }}</span
      >
      <div fxLayout="row" fxLayoutGap="10" fxLayoutAlign="space-between center">
        <div fxFlex="75" fxLayoutGap="10">
          <div class="row" fxFlex="33">
            <!-- <mat-form-field>
              <input
                matInput
                [formControl]="increaseLimitForm.get('otp') | formcontrol"
              />
            </mat-form-field> -->
            <ic-form-field
              placeholder="OTP"
              label="OTP"
              [formControl]="increaseLimitForm.get('otp') | formcontrol"
            ></ic-form-field>
          </div>
          <span class="gray-text" fxLayoutAlign="center center">{{
            'Didn’t receive the OTP?' | translate
          }}</span>
          <span
            class="resend-btn"
            fxLayoutAlign="center center"
            (click)="proceedToOtp()"
            (keydown.enter)="proceedToOtp()"
            tabindex="0"
            >{{ 'Resend Code' | translate }}</span
          >
        </div>
        <div>
          <!-- <app-ic-action-button
            [buttonName]="'Submit' | translate"
            buttonType="filled"
            (onClick)="submitEligibleLimit()"
            [disabled]="!increaseLimitForm.get('otp')?.value"
          ></app-ic-action-button> -->
          <ic-button
            [label]="'Submit' | translate"
            [disabled]="!increaseLimitForm.get('otp')?.value"
            (click)="submitEligibleLimit()"
            icButtonType="filled"
            type="submit"
            size="large"
          ></ic-button>
        </div>
      </div>
    </ng-container>
  </form>
</mat-card>
