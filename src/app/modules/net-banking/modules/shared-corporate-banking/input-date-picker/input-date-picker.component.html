<mat-label *ngIf="!skipLabel && showOutsideLabel">{{ inputLabel }}</mat-label>
<mat-form-field appearance="outline" class="date">
  <mat-label *ngIf="!skipLabel && !showOutsideLabel">{{
    inputLabel
  }}</mat-label>
  <input
    matInput
    [matDatepicker]="picker"
    [formControl]="control"
    [min]="minDate"
    [max]="maxDate"
    [inputMask]="dateMask"
    (dateChange)="dateDispatchEvent($event)"
    (input)="checkError()"
  />
  <mat-datepicker-toggle matSuffix [for]="picker">
    <mat-icon
      svgIcon="calendar-icon"
      matsuffix
      matDatepickerToggleIcon
    ></mat-icon>
  </mat-datepicker-toggle>
  <mat-datepicker
    [dateClass]="dateClass"
    (yearSelected)="onYearSelected($event)"
    (opened)="initEvents()"
    #picker
  >
  </mat-datepicker>
  <mat-error *ngIf="control.hasError('required') && control.touched">
    {{ inputLabel }} is required
  </mat-error>
  <mat-error *ngIf="control.hasError('minDate')">
    {{ minDateDesc }}
  </mat-error>
  <mat-error *ngIf="control.hasError('maxDate')">
    {{ maxDateDesc }}
  </mat-error>
</mat-form-field>
