<ng-container *ngIf="bgIssuanceForm">
  <ng-container *ngIf="bgType == 'BG Issuance'">
    <app-bg-issuance-bg-info
      [bgIssuanceBgInfoForm]="
        bgIssuanceForm.get('bgIssuanceBgInfo') | formgroup
      "
    >
    </app-bg-issuance-bg-info>
  </ng-container>

  <ng-container *ngIf="bgType != 'BG Issuance'">
    <app-bg-amend-bg-info
      [bgAmendBgInfoForm]="
        bgIssuanceForm.get('bgAmendBgInfoDetails') | formgroup
      "
    >
    </app-bg-amend-bg-info>
  </ng-container>
  <ng-container>
    <app-benificiary-details
      [benificiaryDetailsForm]="
        bgIssuanceForm.get('benificiaryDetails') | formgroup
      "
      [componentName]="bgType"
    ></app-benificiary-details>
  </ng-container>

  <ng-container *ngIf="bgType != 'BG Issuance'">
    <app-transaction-info
      [transactionInfoForm]="
        bgIssuanceForm.get('transactionInfoDetails') | formgroup
      "
    >
    </app-transaction-info>
  </ng-container>
</ng-container>
