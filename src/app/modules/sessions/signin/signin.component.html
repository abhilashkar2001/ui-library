<div fxLayoutAlign="center center" style="background-color: #fff">
  <div class="login_container">
    <div
      class="login_content"
      data-aos="zoom-in"
      data-aos-delay="200"
      data-aos-duration="500"
    >
      <h1 class="login_heading">{{ appData.title }}</h1>

      <h2 *ngIf="authType === 'signIn'" class="login_subtitle">
        {{ appData.greeting }}
      </h2>

      <div *ngIf="authType === 'signIn'" class="login_form" fxLayout="column">
        <form [formGroup]="signinForm">
          <!-- <mat-form-field appearance="outline">
            <mat-label>{{ 'Corporate Id' | translate }}</mat-label>
            <input
              matInput
              formControlName="corporateId"
              type="text"
              name="corporateId"
              class="alignCred"
              placeholder="Corporate Id"
              maxlength="30"
              autocomplete="off"
              oninput="this.value = this.value.toUpperCase()"
            />
            <mat-error
              *ngIf="signinForm.get('corporateId')?.hasError('required')"
              class=""
            >
              {{ 'Corporate Id is Required!' | translate }}
            </mat-error>
          </mat-form-field> -->
          <ic-form-field
            [control]="signinForm.get('corporateId') | formcontrol"
            [icNumbersOnly]="true"
            [label]="'corporateId' | translate"
            [maxLength]="30"
            autocomplete="off"
            oninput="this.value = this.value.toUpperCase()"
            placeholder="corporateId"
            type="text"
          ></ic-form-field>

          <!-- <mat-form-field appearance="outline">
            <mat-label>{{ 'Login Id' | translate }}</mat-label>
            <input
              matInput
              formControlName="username"
              type="text"
              name="username"
              class="alignCred"
              placeholder="Login Id"
              maxlength="30"
              autocomplete="off"
              oninput="this.value = this.value.toUpperCase()"
            />
            (keypress)="onKeyPress($event)"
             oninput="this.value = this.value.toUpperCase()"
            <mat-error
              *ngIf="signinForm.get('username')?.hasError('required')"
              class=""
            >
              {{ 'Login Id is Required!' | translate }}
            </mat-error>
          </mat-form-field> -->
          <ic-form-field
            [control]="signinForm.get('username') | formcontrol"
            [label]="'Login Id' | translate"
            [maxLength]="30"
            autocomplete="off"
            oninput="this.value = this.value.toUpperCase()"
            placeholder="Login Id"
            type="text"
          ></ic-form-field>

          <!-- <mat-form-field class="full-width custom-field" appearance="outline">
            <mat-label>{{ 'Password' | translate }}</mat-label>
            <input
              matInput
              formControlName="password"
              [type]="hide ? 'password' : 'text'"
              name="password"
              placeholder="********"
              autocomplete="off"
              class="alignCred"
            />
            <mat-icon
              class="opacity-25"
              matSuffix
              (click)="hide = !hide"
              style="cursor: pointer"
              >{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon
            >
            <mat-error
              *ngIf="signinForm.get('password')?.hasError('required')"
              class=""
            >
              {{ 'Password is Required!' | translate }}
            </mat-error>
          </mat-form-field> -->
          <ic-form-field
            (onSuffixClick)="visibiltiy($event)"
            [control]="signinForm.get('password') | formcontrol"
            [suffixIcon]="hide ? 'visibility-off-grey' : 'visibility-on-grey'"
            [type]="hide ? 'password' : 'text'"
            autocomplete="off"
            label="Password"
            placeholder="Password"
          >
          </ic-form-field>

          <div class="mt-2" fxLayout="row" fxLayoutAlign="space-between center">
            <div class="pb-16 text-right" fxFlex="100">
              <a class="forget">
                {{ 'Forgot Password?' | translate }}
              </a>
            </div>
          </div>

          <button (click)="submit()" class="login_sigin">
            {{ 'Sign In' }}
          </button>
        </form>
      </div>

      <div *ngIf="authType === 'otp'">
        <div fxLayout="column" fxLayoutGap="20px">
          <div class="mt-24" fxLayout="row">
            <div fxFlex="80">
              <h2 class="auth_title">{{ 'OTP Authentication' }}</h2>
              <p class="auth_subtitle">
                An authentication code has been sent to<br />
                registered Email.
              </p>
            </div>
          </div>

          <ng-container>
            <ng-otp-input
              #ngOtpInput
              (onInputChange)="onOtpChange($event)"
              [config]="config"
              class="ng_otp_input"
            ></ng-otp-input>
          </ng-container>

          <button class="forget" fxFlex="50" fxLayoutAlign="flex-start">
            {{ 'Resend OTP' | translate }}
          </button>

          <div class="auth_button_wrapper" fxLayout="row" fxLayoutGap="2">
            <!-- <button class="saveButton" fxFlex="40" (click)="onVerify()">
              {{ 'Verify' | translate }}
            </button> -->
            <ic-button
              (click)="onVerify()"
              [label]="'Verify' | translate"
              fxFlex="40"
              icButtonType="filled-rounded"
              size="large"
              type="submit"
            ></ic-button>
            <button (click)="goBack()" class="exitButton" fxFlex="40">
              {{ 'Exit' | translate }}
            </button>
          </div>
        </div>
      </div>
    </div>
    <div
      class="login_image"
      data-aos="fade-right"
      data-aos-delay="200"
      data-aos-duration="500"
    >
      <img alt="logPerson" src="/assets/images/logPerson_img.svg" />
    </div>
  </div>
</div>
