<div class="error_popup_container">
  <div class="error_popup_body">
    <h3 class="bold-error-message">{{ errorDetails?.error || 'Oops!' }}</h3>
    <p class="error-description">
      {{ errorDetails?.message || 'Something went wrong' }}
    </p>
    <ic-button
      label="Back"
      icButtonType="filled-rounded"
      type="submit"
      (click)="back()"
      size="large"
    ></ic-button>
  </div>
  <div class="error_popup_img">
    <img [src]="imageUrl" alt="" />
  </div>
</div>
