<div class="error-container">
  <div class="message-area">
    <h1 class="bold-error-code">
      4<span class="bold-error-code-style-in-middle">0</span>1
    </h1>
    <h3 class="bold-error-message">
      <span class="internal-server">unauthorized</span>
      error
    </h3>
    <p class="error-description">
      401 Unauthorized response status code<br />
      indicates that the client request has not been completed because it lacks
      valid authentication credentials for the requested resource.
    </p>
    <button mat-raised-button color="primary" (click)="back()">Refresh</button>
  </div>
  <img src="assets/images/401-error.svg" alt="" />
</div>
