<div class="canvas_container" style="text-align: center; margin-top: 30px">
  <canvas
    #canvas
    (mousedown)="handleMouseDown($event)"
    (mouseleave)="handleMouseUp()"
    (mousemove)="handleMouseMove($event)"
    (mouseup)="handleMouseUp()"
    height="150"
    width="740"
  >
  </canvas>
  <button (click)="clearCanvas()" mat-icon-button>
    <mat-icon class="reload" svgIcon="reload-icon"></mat-icon>
  </button>
</div>
