<div class="main_page white-background">
  <mat-card class="default-card m-24">
    <div fxLayout="row" fxLayoutAlign="flex-end center">
      <!-- <h1 class="bank-title">{{ currentUser?.bankName | titlecase }}</h1> -->
      <div fxLayout="row" fxLayoutGap="10px">
        <button mat-raised-button class="reset-btn" (click)="openEsign()">
          <img
            src="../../../../../../../assets/images/edit-icon.svg"
            alt="edit"
            class="mr-8"
          />
          E-Sign
        </button>
        <button mat-raised-button class="reset-btn">
          <img
            src="../../../../../../../assets/images/share.png"
            alt=""
            class="mr-8"
          />
          Share
        </button>
        <button mat-raised-button class="submit-btn" (click)="handleDownload()">
          <img
            src="../../../../../../../assets/images/download_white.svg"
            alt=""
            class="mr-8"
          />Download
        </button>
        <button mat-raised-button class="submit-btn">
          <img
            src="../../../../../../../assets/images/upload_white.svg"
            alt=""
            class="mr-8"
          />
          Upload
        </button>
      </div>
    </div>
    <div>
      <div fxLayout="row">
        <mat-card class="default-card mx-0 letter-card" fxFlex="70">
          <div *ngIf="dataLocalUrl != undefined" class="h-100">
            <object
              [data]="dataLocalUrl"
              type="application/pdf"
              width="100%"
              height="100%"
            ></object>
          </div>
        </mat-card>
        <div fxLayout="column" fxLayoutAlign="space-between start" class="p-12">
          <div>
            <div fxLayout="row">
              <mat-icon
                class="material-icons-outlined mt-12"
                style="color: #004c97"
                >info</mat-icon
              >
              <h3 class="sub-heading">Offer Letter</h3>
            </div>
            <div fxLayout="row wrap" fxLayoutAlign="space-between center">
              <h3 class="text-highlighted w-100">Vehicle_Loan.pdf</h3>
              <div>
                <span class="text-normal">Offer Issue: </span
                ><span class="text-highlighted">31 May 2024</span>
              </div>
              <div>
                <span class="text-normal">Offer Expiry:</span
                ><span class="text-highlighted"> 10 June 2024</span>
              </div>
            </div>
            <div class="horizontal-bar"></div>

            <div fxLayout="column">
              <h3 class="title-text">Applicants</h3>
              <div
                fxLayout="row"
                fxLayoutAlign="space-between center"
                class="mb-12"
              >
                <span class="text-label"
                  >{{ customerInfo?.firstName }}
                  {{ customerInfo?.lastName }}</span
                >
                <button class="status_btn">REQUESTED</button>
              </div>
            </div>
            <div class="horizontal-bar"></div>

            <div>
              <h3 class="title-text">Sign Requested By</h3>
              <span class="text-label">Sales Department</span>
            </div>
          </div>
          <div>
            <span class="text-gray">Secured by: </span
            ><span class="text-highlighted">Demobank</span>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div fxLayout="row" fxLayoutGap="10px">
        <button
          fxFlex="15"
          mat-raised-button
          class="submit-btn"
          (click)="saveCustomerResponse('Accept')"
        >
          Accept
        </button>
        <button
          fxFlex="15"
          mat-raised-button
          class="reset-btn"
          style="color: #b20000"
          (click)="saveCustomerResponse('Reject')"
        >
          Reject
        </button>
        <button
          fxFlex="15"
          mat-raised-button
          class="reset-btn"
          (click)="saveCustomerResponse('Revisited')"
        >
          Revisited
        </button>
      </div>
    </div>
  </mat-card>
</div>
