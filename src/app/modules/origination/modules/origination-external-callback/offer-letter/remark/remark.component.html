<div
  *ngIf="revisiteForm"
  [formGroup]="revisiteForm"
  class="main_page_container"
  fxFlex="100"
  fxLayout="row wrap"
  fxLayoutGap="10"
>
  <span class="bank-title" fxFlex="100">
    {{ currentuser?.bankName | titlecase }}
  </span>
  <ng-container *ngIf="type === 'revisit'">
    <mat-card class="container p-8" fxFlex="100" fxLayout="column">
      <h2 class="header_md_bold_black mb-16">Revisit Information</h2>
      <div
        *ngIf="revisiteForm"
        [formGroup]="revisiteForm"
        fxLayout="row"
        fxLayout.lt-sm="column"
        fxLayoutGap="16px"
      >
        <!-- Approved Detail Section -->
        <div class="info-card" fxFlex="50" fxFlex="100" fxLayout="row wrap">
          <h5 class="header_md_bold_black mb-16" fxFlex="100">
            Approved Detail
          </h5>
          <mat-card class="container p-8" fxFlex="100">
            <ic-form-field
              [control]="revisiteForm.get('amount') | formcontrol"
              fxFlex="100"
              label="Amount"
            ></ic-form-field>

            <div fxFlex="100" fxLayout="row" fxLayoutGap="16px">
              <ic-form-field
                [control]="revisiteForm.get('rateOfInterest') | formcontrol"
                fxFlex="50"
                label="Rate of Interest"
              ></ic-form-field>
              <ic-tenure-field
                [fieldLabels]="{
                  tenureYear: 'Years',
                  tenureMonth: 'Months',
                  tenureDays: 'Days',
                }"
                [fields]="['tenureYear', 'tenureMonth', 'tenureDays']"
                [parentForm]="revisiteForm"
                fxFlex="50"
                label="Loan Tenure"
              >
              </ic-tenure-field>
            </div>
          </mat-card>
        </div>

        <!-- Customer Request Section -->
        <div class="info-card" fxFlex="50" fxFlex="100" fxLayout="row wrap">
          <h5 class="header_md_bold_black mb-16" fxFlex="100">
            Customer Request
          </h5>
          <mat-card class="container p-8" fxFlex="100">
            <ic-form-field
              [control]="revisiteForm.get('requestedAmount') | formcontrol"
              label="Amount"
            ></ic-form-field>

            <div fxLayout="row" fxLayoutGap="16px">
              <ic-form-field
                [control]="
                  revisiteForm.get('requestedRateOfInterest') | formcontrol
                "
                fxFlex="50"
                label="Rate of Interest"
              ></ic-form-field>
              <ic-tenure-field
                [fieldLabels]="{
                  requestedLoanTenureYear: 'Years',
                  requestedLoanTenureMonth: 'Months',
                  requestedLoanTenureDay: 'Days',
                }"
                [fields]="[
                  'requestedLoanTenureYear',
                  'requestedLoanTenureMonth',
                  'requestedLoanTenureDay',
                ]"
                [parentForm]="revisiteForm"
                fxFlex="50"
                label="Loan Tenure"
              >
              </ic-tenure-field>
            </div>
          </mat-card>
        </div>
      </div>
    </mat-card>
  </ng-container>

  <div fxFlex="100" fxLayout="row wrap" fxLayoutAlign="space-between start">
    <div fxFlex="100" fxLayout="row wrap">
      <h3 class="header_md_bold_black mt-16" fxFlex="100">Remarks</h3>
      <ic-textarea
        [control]="revisiteForm.get('remark') | formcontrol"
        [rows]="5"
        fxFlex="100"
      >
      </ic-textarea>
    </div>
    <h5 *ngIf="type === 'revisit'" class="mb-16" fxFlex="100">
      <span class="header_md_bold_black">Note:</span>
      <span class="breadcrum_sm">
        Help us by providing additional Information for revisiting this
        application.
      </span>
    </h5>
    <div
      class="action-dig-sign-btn"
      fxFlex="100"
      fxLayout="row"
      fxLayoutAlign="end center"
      fxLayoutGap="2%"
    >
      <ic-button
        (OnClick)="resetRemark()"
        [icButtonType]="'ghost-rounded'"
        label="Reset"
      ></ic-button>
      <ic-button
        (OnClick)="saveCustomerRequest()"
        [icButtonType]="'filled-rounded'"
        label="Submit"
      ></ic-button>
    </div>
  </div>
</div>
