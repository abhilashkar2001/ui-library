<div class="file_upload">
  <form [formGroup]="createDocumentForm" fxFlex="100" fxLayout="column">
    <div fxLayout="row" fxLayoutAlign="end center" style="margin: 1rem 0">
      <div
        class="custom-add-btn"
        [matMenuTriggerFor]="docMenu"
        #trigger="matMenuTrigger"
      >
        <span class="btn-text">Add</span>
        <span class="btn-icon">
          <img src="assets/images/down_arrow.svg" alt="dropdown" />
        </span>
      </div>
      <button
        mat-button
        [matMenuTriggerFor]="docMenu"
        #trigger
        style="display: none"
      ></button>
    </div>

    <mat-menu #docMenu="matMenu" class="custom-menu">
      <button
        mat-menu-item
        *ngFor="let doc of noReqCheckListDocList"
        (click)="addDocumentFromDropdown(doc?.document)"
      >
        {{ doc?.document }}
      </button>
    </mat-menu>

    <ng-container formArrayName="otherDocument">
      <div
        *ngFor="let docCtrl of otherDocument().controls; let i = index"
        [formGroupName]="i"
        class="document-panel"
      >
        <mat-expansion-panel class="styled-panel" [expanded]="true">
          <mat-expansion-panel-header class="panel-header">
            <div class="panel-header-content">
              <div
                class="panel-title"
                fxLayoutGap="5"
                fxLayoutAlign="start center"
              >
                <img
                  *ngIf="getFileInfo(i)?.length > 0; else unticked"
                  src="assets/images/tickicon.svg"
                  alt="Tick"
                />
                <ng-template #unticked>
                  <img src="assets/images/untickicon.svg" alt="Untick" />
                </ng-template>
                <span class="header_md">
                  {{ docCtrl.get('documentType')?.value || 'New Document' }}
                </span>
                <span *ngIf="docCtrl.get('docRequired')?.value" class="required"
                  >*</span
                >
              </div>
              <span
                [ngClass]="
                  docCtrl.get('docRequired')?.value
                    ? 'disabled_delete'
                    : 'delete_btn'
                "
                (click)="removeDocument(i)"
                tabindex="0"
                (keydown)="removeDocument(i)"
              >
                Delete
              </span>
            </div>
          </mat-expansion-panel-header>

          <div fxLayout="column">
            <div class="upload-section">
              <span class="medium_txt">Upload files</span>
              <p class="breadcrum_md">
                Max file size is 500kb. Supported file types are .jpg and .png.
              </p>
              <ic-button
                (OnClick)="fileBrowseHandler(i)"
                label="Choose"
                size="medium"
                type="button"
                icButtonType="outlined-rounded"
              >
              </ic-button>
            </div>

            <div
              class="uploaded_list"
              fxLayout="row wrap"
              fxFlex="100"
              fxLayoutAlign="space-between center"
            >
              <div
                *ngFor="let file of getFileInfo(i); let fileIndx = index"
                fxFlex="49"
                fxLayoutGap="10"
                class="upload_img"
              >
                <div class="img_box">
                  <img [src]="getFileUrl(file)" alt="image" />
                </div>
                <div class="img_container">
                  <span class="header_md img_name">{{ file?.name }}</span>
                  <div
                    *ngIf="file.progress === '100%'; else showSize"
                    class="progress-cont"
                  >
                    <div
                      [style.width]="file.progress ?? '0%'"
                      class="progress"
                    ></div>
                  </div>
                  <ng-template #showSize>
                    <div class="theme_sm">{{ file.size }}</div>
                  </ng-template>
                </div>
                <img
                  tabindex="0"
                  (keydown.enter)="removeFile(i, fileIndx)"
                  src="assets/images/trash_new.svg"
                  alt="trash"
                  (click)="removeFile(i, fileIndx)"
                />
              </div>
            </div>
          </div>
        </mat-expansion-panel>
      </div>
    </ng-container>

    <div
      fxFlex="100"
      fxLayout="row"
      fxLayoutGap="1%"
      style="margin-top: 50px"
      fxLayoutAlign="end center"
    >
      <div>
        <ic-button
          [label]="'Back'"
          [type]="'button'"
          icButtonType="ghost-rounded-danger"
          size="medium"
        >
        </ic-button>
      </div>
      <div>
        <ic-button
          [icButtonType]="'filled-rounded'"
          [label]="'Next'"
          [type]="'submit'"
          size="medium"
        >
        </ic-button>
      </div>
    </div>
  </form>
</div>
