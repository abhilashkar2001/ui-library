<div fxFlex="100" fxLayout="column">
  <div fxFlex="100" fxLayout="row" fxLayoutGap="5">
    <div fxFlex="24">
      <ic-select
        label="Cheque Book Size"
        [control]="chequeBookForm?.get('chequeBookSize') | formcontrol"
      >
      </ic-select>
    </div>
    <div fxFlex="24">
      <ic-form-field
        label="Account Number"
        [control]="chequeBookForm?.get('accountNo') | formcontrol"
      ></ic-form-field>
    </div>
    <div fxFlex="24">
      <ic-select
        label="Cheque Book Type"
        [control]="chequeBookForm?.get('chequeBookType') | formcontrol"
      >
      </ic-select>
    </div>
  </div>
  <div fxFlex="100">
    <p>Delivery Location</p>
    <div fxLayout="row" fxLayoutGap="10">
      <ic-radio-button
        [control]="chequeBookForm?.get('deliveryLocation') | formcontrol"
        label="My Address"
        value="My Address"
      ></ic-radio-button>
      <ic-radio-button
        [control]="chequeBookForm?.get('deliveryLocation') | formcontrol"
        label="Branch Near Me"
        value="Branch Near Me"
      ></ic-radio-button>
    </div>
  </div>
  <!-- Delivery location Based -->
  <div
    fxLayout="column"
    class="delivery-cont"
    *ngIf="chequeBookForm?.get('deliveryLocation')?.value === 'My Address'"
  >
    <p>Delivery Address</p>
    <div fxFlex="100" fxLayout="row" fxLayoutGap="20">
      <div
        class="service-cont"
        [ngClass]="
          chequeBookForm?.get('deliveryAddress')?.value ===
          'Communication Address'
            ? 'active'
            : ''
        "
      >
        <ic-radio-button
          [control]="chequeBookForm?.get('deliveryAddress') | formcontrol"
          label="Communication Address"
          value="Communication Address"
        ></ic-radio-button>
        <p>Akshaya Nagar 1st Block 1st Cross, Bangalore-560016</p>
      </div>
      <div
        class="service-cont"
        [ngClass]="
          chequeBookForm?.get('deliveryAddress')?.value !=
          'Communication Address'
            ? 'active'
            : ''
        "
      >
        <ic-radio-button
          [control]="chequeBookForm?.get('deliveryAddress') | formcontrol"
          label="Permanent Address"
          value="Permanent Address"
        ></ic-radio-button>
        <p>Akshaya Nagar 1st Block 1st Cross, Bangalore-560016</p>
      </div>
      <div></div>
    </div>
  </div>
  <div
    *ngIf="chequeBookForm?.get('deliveryLocation')?.value === 'Branch Near Me'"
    fxLayoutGap="5"
    fxFlex="100"
    class="delivery-cont"
    fxLayout="column"
  >
    <p fxFlex="100">Select Branch</p>
    <div fxFlex="100" fxLayoutGap="5">
      <div fxFlex="24">
        <ic-form-field
          label="Bank Name"
          [control]="chequeBookForm?.get('bankName') | formcontrol"
        ></ic-form-field>
      </div>
      <div fxFlex="24">
        <ic-form-field
          label="Bank Code"
          suffixIcon="search"
          (onSuffixClick)="branchCodeFinder()"
          [control]="chequeBookForm?.get('bankCode') | formcontrol"
        ></ic-form-field>
      </div>
    </div>
  </div>
</div>
