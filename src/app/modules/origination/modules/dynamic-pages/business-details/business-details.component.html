<div [formGroup]="businessDetailsForm" class="business-main" fxLayout="column">
  <div fxLayout="row wrap" fxLayoutGap="1%">
    <div fxFlex="49">
      <ic-form-field
        [control]="businessDetailsForm.get('businessName') | formcontrol"
        [icAlphabetOnly]="true"
        [maxLength]="100"
        label="Business Name"
      ></ic-form-field>
    </div>
    <div fxFlex="49">
      <ic-form-field
        [control]="contact.get('telephone') | formcontrol"
        [icNumbersOnly]="true"
        [maxLength]="20"
        label="Telephone Number"
      ></ic-form-field>
    </div>
    <div fxFlex="99">
      <ic-form-field
        [control]="address.at(0).get('address1') | formcontrol"
        [icAlphanumeric]="true"
        [maxLength]="250"
        label="Business Address"
      ></ic-form-field>
    </div>
    <div fxFlex="49">
      <ic-form-field
        [control]="businessDetailsForm.get('yearsOfOperation') | formcontrol"
        [icNumbersOnly]="true"
        [maxLength]="3"
        label="No of years in operation"
      ></ic-form-field>
    </div>
    <div fxFlex="49">
      <ic-select
        [control]="businessDetailsForm.get('natureOfBusinessId') | formcontrol"
        [options]="industryTypeList"
        bindLabelKey="values"
        bindValueKey="id"
        label="Industry Type"
      >
      </ic-select>
    </div>
    <div fxFlex="49">
      <ic-form-field
        [control]="businessDetailsForm.get('typeOfService') | formcontrol"
        [icAlphabetOnly]="true"
        [maxLength]="255"
        label="Types of Goods service"
      ></ic-form-field>
    </div>
    <div fxFlex="49">
      <ic-form-field
        [control]="businessDetailsForm.get('monthlyTurnover') | formcontrol"
        [decimalPlaces]="3"
        [icTwoDigitDecimalNumber]="true"
        [maxLength]="20"
        [numLength]="18"
        [prefixIcon]="
          businessDetailsForm.value?.monthlyTurnover ? currencySymboll : ''
        "
        label="Monthly Turn over"
      ></ic-form-field>
    </div>
    <div fxFlex="49">
      <ic-form-field
        [control]="businessDetailsForm.get('aveStockLevel') | formcontrol"
        [icNumbersOnly]="true"
        [maxLength]="20"
        label="AVE stock Level"
      ></ic-form-field>
    </div>
  </div>

  <div fxFlex="100" fxLayout="row" fxLayoutGap="2%" style="margin-top: 50px">
    <div>
      <ic-button
        (OnClick)="saveBusinessDetails()"
        [icButtonType]="'filled-rounded'"
        [label]="'Confirm' | translate"
        [type]="'submit'"
        size="large"
      >
      </ic-button>
    </div>
    <div>
      <ic-button
        (OnClick)="onBack()"
        [label]="'Back'"
        [type]="'button'"
        icButtonType="ghost-rounded-danger"
        size="large"
      >
      </ic-button>
    </div>
  </div>
</div>
