<div class="business-main" [formGroup]="businessDetailsForm" fxLayout="column">
  <div fxLayout="row wrap" fxLayoutGap="1%">
    <div fxFlex="49">
      <ic-form-field
        label="Business Name"
        [control]="businessDetailsForm.get('businessName') | formcontrol"
      ></ic-form-field>
    </div>
    <div fxFlex="49">
      <ic-form-field
        label="Telephone Number"
        [control]="contact.get('telephone') | formcontrol"
      ></ic-form-field>
    </div>
    <div fxFlex="99">
      <ic-form-field
        label="Business Address"
        [control]="address.at(0).get('address1') | formcontrol"
      ></ic-form-field>
    </div>
    <div fxFlex="49">
      <ic-form-field
        label="No of years in operation"
        [control]="businessDetailsForm.get('yearsOfOperation') | formcontrol"
      ></ic-form-field>
    </div>
    <div fxFlex="49">
      <ic-select
        label="Industry Type"
        [options]="industryTypeList"
        bindValueKey="id"
        bindLabelKey="values"
        [control]="businessDetailsForm.get('natureOfBusinessId') | formcontrol"
      >
      </ic-select>
    </div>
    <div fxFlex="49">
      <ic-form-field
        label="Types of Goods service"
        [control]="businessDetailsForm.get('typeOfService') | formcontrol"
      ></ic-form-field>
    </div>
    <div fxFlex="49">
      <ic-form-field
        label="Monthly Turn over"
        [control]="businessDetailsForm.get('monthlyTurnover') | formcontrol"
      ></ic-form-field>
    </div>
    <div fxFlex="49">
      <ic-form-field
        label="AVE stock Level"
        [control]="businessDetailsForm.get('aveStockLevel') | formcontrol"
      ></ic-form-field>
    </div>
  </div>

  <div fxFlex="100" fxLayout="row" fxLayoutGap="2%" style="margin-top: 50px">
    <div>
      <ic-button
        [label]="'Confirm' | translate"
        [type]="'submit'"
        size="large"
        (OnClick)="saveBusinessDetails()"
        [icButtonType]="'filled-rounded'"
      >
      </ic-button>
    </div>
    <div>
      <ic-button
        [label]="'Back'"
        icButtonType="ghost-rounded-danger"
        size="large"
        [type]="'button'"
        (OnClick)="onBack()"
      >
      </ic-button>
    </div>
  </div>
</div>
