<section>
  <form *ngIf="loanDetailsForm" [formGroup]="loanDetailsForm" fxLayout="column">
    <!-- LOAN DETAILS -->
    <h2 class="highlight_title">Loan Details</h2>
    <div fxLayout="row wrap" fxLayoutGap="1%">
      <div fxFlex="48">
        <ic-form-field
          label="Loan Amount Requested (GHS)"
          [control]="loanDetails.get('loanAmount') | formcontrol"
          [prefixIcon]="loanDetails.value?.loanAmount ? currencySymboll : ''"
        ></ic-form-field>
      </div>
      <div fxFlex="48">
        <ic-form-field
          label="Interest Rate %"
          [control]="loanDetails.get('interestRate') | formcontrol"
          [readonly]="true"
        ></ic-form-field>
      </div>
      <div fxFlex="48" class="MiscellaneousClass">
        <ic-tenure-field
          label="Tenure"
          [fields]="['loanTenureYear', 'loanTenureMonth', 'loanTenureDays']"
          [fieldLabels]="{
            loanTenureYear: 'Years',
            loanTenureMonth: 'Months',
            loanTenureDays: 'Days',
          }"
          [parentForm]="loanDetails"
        >
        </ic-tenure-field>
      </div>
      <div fxFlex="48">
        <ic-select
          [options]="genericValue?.REPAYMENTFREQUENCY"
          [control]="repaymentModel.get('repaymentFrequencyId') | formcontrol"
          bindLabelKey="values"
          bindValueKey="id"
          label="Repayment Frequency"
        ></ic-select>
      </div>
      <div fxFlex="48">
        <ic-form-field
          *ngIf="loanDetails?.get('emiAmount')"
          label="EMI Amount"
          [control]="loanDetails.get('emiAmount') | formcontrol"
          [disabled]="true"
          [prefixIcon]="loanDetails.value?.emiAmount ? currencySymboll : ''"
        ></ic-form-field>
      </div>
      <div fxFlex="48">
        <ic-form-field
          label="EMI Interest Payable"
          [control]="loanDetailsForm.get('interestPayable') | formcontrol"
          [disabled]="true"
          [prefixIcon]="
            loanDetailsForm.value?.interestPayable ? currencySymboll : ''
          "
        ></ic-form-field>
      </div>
      <div fxFlex="48">
        <ic-form-field
          label="Total Interest Amount"
          [control]="loanDetailsForm.get('totalInterestAmount') | formcontrol"
          [disabled]="true"
          [prefixIcon]="
            loanDetailsForm.value?.totalInterestAmount ? currencySymboll : ''
          "
        ></ic-form-field>
      </div>
      <div fxFlex="48">
        <ic-form-field
          label="Total Payable Amount"
          [control]="loanDetailsForm.get('totalPayableAmount') | formcontrol"
          [disabled]="true"
          [prefixIcon]="
            loanDetailsForm.value?.totalPayableAmount ? currencySymboll : ''
          "
        ></ic-form-field>
      </div>
      <div fxFlex="48" class="enabled-mat-form-field">
        <mat-form-field
          appearance="outline"
          class="full-width custom-field fieldinput"
        >
          <mat-label class="custom-mat-label">EMI Start Date</mat-label>
          <input
            matInput
            [matDatepicker]="picker"
            [formControl]="
              repaymentModel.get('firstRepaymentDate') | formcontrol
            "
            [min]="currentDate"
            readonly
          />
          <mat-error
            *ngIf="
              repaymentModel.get('firstRepaymentDate')?.hasError('required')
            "
          >
            EMI Payment Start Date is <strong>required</strong>
          </mat-error>
          <mat-datepicker-toggle matSuffix [for]="picker">
            <mat-icon matDatepickerToggleIcon svgIcon="calendar"> </mat-icon>
          </mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>

    <h2 class="highlight_title">Main Banking Details</h2>
    <div fxLayout="row wrap" fxLayoutGap="1%">
      <div fxFlex="48">
        <ic-select
          [options]="genericValue?.DISBURSEMENTTYPE"
          [control]="
            loanDisbursementModel.get('disbursementModeId') | formcontrol
          "
          bindLabelKey="values"
          bindValueKey="id"
          label="Disbursement Type"
          (selectionChange)="setDisbursement($event)"
        ></ic-select>
      </div>
      <ng-container
        *ngIf="
          loanDisbursementModel?.get('disbursementMode')?.value === 'Account'
        "
      >
        <div
          fxFlex="48"
          class="enabled-mat-form-field p-8"
          fxLayout="row wrap"
          fxLayoutAlign="start center"
        >
          <mat-label class="header_md_bold_black" fxFlex="100"
            >Account</mat-label
          >
          <ic-radio-button
            fxFlex="25"
            *ngFor="let account of accountValue"
            [control]="loanDisbursementModel.get('internal') | formcontrol"
            [value]="account.value"
            [label]="account.label"
          >
          </ic-radio-button>
        </div>
        <div fxFlex="48">
          <ic-form-field
            label="Bank Name"
            [control]="loanDisbursementAccount.get('bankName') | formcontrol"
          ></ic-form-field>
        </div>
        <div fxFlex="48">
          <ic-form-field
            label="Account Number"
            [control]="loanDisbursementAccount.get('accountNo') | formcontrol"
          ></ic-form-field>
        </div>
        <div fxFlex="48">
          <ic-select
            [options]="genericValue?.ACCOUNTTYPE"
            [control]="loanDisbursementAccount.get('accountType') | formcontrol"
            bindLabelKey="values"
            bindValueKey="id"
            label="Account Type"
          ></ic-select>
        </div>
        <div fxFlex="48">
          <ic-form-field
            label="Account Name"
            [control]="loanDisbursementModel.get('customerName') | formcontrol"
          ></ic-form-field>
        </div>
        <div
          fxFlex="48"
          *ngIf="loanDisbursementModel?.get('internal')?.value === false"
        >
          <ic-form-field
            label="Bank Code"
            [control]="loanDisbursementAccount.get('bankCode') | formcontrol"
          ></ic-form-field>
        </div>
        <div fxFlex="48">
          <ic-form-field
            label="Branch Name"
            [control]="loanDisbursementAccount.get('branchName') | formcontrol"
          ></ic-form-field>
        </div>
      </ng-container>
      <ng-container
        *ngIf="
          loanDisbursementModel?.get('disbursementMode')?.value === 'Cheque'
        "
      >
        <div fxFlex="48">
          <ic-form-field
            label="Cheque Number"
            [control]="loanDisbursementModel.get('chequeNumber') | formcontrol"
          ></ic-form-field>
        </div>
        <div fxFlex="48">
          <ic-form-field
            label="Account Number"
            [control]="loanDetailsForm.get('accountNo') | formcontrol"
          ></ic-form-field>
        </div>
        <div fxFlex="48">
          <ic-form-field
            label="Account Holder Name"
            [control]="loanDisbursementModel.get('customerName') | formcontrol"
          ></ic-form-field>
        </div>
        <div fxFlex="48">
          <ic-form-field
            label="Bank Name"
            [control]="loanDetailsForm.get('accountHolderName') | formcontrol"
          ></ic-form-field>
        </div>
      </ng-container>
    </div>

    <div fxFlex="100" class="button-section" fxLayout="row">
      <ic-button
        [label]="'Confirm'"
        [type]="'submit'"
        size="large"
        [icButtonType]="'filled-rounded'"
        (click)="onConfirm()"
      >
      </ic-button>
      &nbsp;&nbsp;
      <ic-button
        [label]="'Back'"
        icButtonType="ghost-rounded-danger"
        size="large"
        [type]="'button'"
        (click)="onBack()"
      >
      </ic-button>
      &nbsp;&nbsp;
    </div>
  </form>
</section>
