<div
  *ngFor="let subAccount of subLoanList; let index = index"
  class="container"
>
  <div class="loan-container" fxFlex="100">
    <div fxFlex="100">
      <app-common-product
        (apply)="goForCalculator($event)"
        (customClassApply)="customClassApply($event)"
        [productIndex]="index"
        [subAccount]="subAccount"
      >
      </app-common-product>
    </div>
  </div>
</div>
