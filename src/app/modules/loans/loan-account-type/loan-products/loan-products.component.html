<div *ngFor="let subAccount of subLoanList; let index = index">
  <div class="loan-container" fxFlex="100">
    <div fxFlex="100">
      <app-common-product
        [subAccount]="subAccount"
        [productIndex]="index"
        (onApply)="goForCalculator($event)"
        (customClassApply)="customClassApply($event)"
      >
      </app-common-product>
    </div>
  </div>
</div>
