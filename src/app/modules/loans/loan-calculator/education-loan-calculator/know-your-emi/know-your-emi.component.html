<div fxFlex="row" fxFlex="100%">
  <div
    fxFlex="70"
    fxLayout="column"
    fxFlex="100"
    *ngIf="loanForm"
    class="loanForm"
  >
    <form [formGroup]="loanForm" fxFlex="100">
      <div class="calculator_container" fxLayout="column" fxFlex="100">
        <div
          fxLayout="row wrap"
          fxFlex="100"
          fxLayoutAlign="space-between center"
        >
          <div class="calculator_subTItle">Loan Required</div>
          <div>
            <div fxFlex="100">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label class="custom-mat-label">Amount</mat-label>
                <input matInput formControlName="amount" />
              </mat-form-field>
            </div>
          </div>
        </div>
        <div fxFlex="100">
          <mat-slider
            [(ngModel)]="loanForm.value.amount"
            [max]="max"
            [min]="min"
            fxFlex="100"
            [step]="thumbLabel"
            (change)="onSliderChange($event)"
            [displayWith]="formatLoanLabel"
            discrete
          >
            <input matSliderThumb #slider />
          </mat-slider>
        </div>
        <div fxLayout="row" fxFlex="100" fxLayoutAlign="space-between center">
          <div>$ {{ min }}</div>
          <div>$ {{ max }}</div>
        </div>

        <div
          class="row"
          fxLayoutAlign="space-between center"
          style="margin-top: 27px"
        >
          <div class="col-md-6 col-12">
            <label class="calculator_subTItle">Tenure</label>
            <fieldset class="yeardrop fieldset">
              <legend visible="true" class="legend-font legend">
                Loan Period
              </legend>
              <div fxLayout="row" class="parentYearDiv">
                <mat-form-field
                  appearance="outline"
                  class="full-width inputSelect"
                >
                  <input
                    matInput
                    name="tenureYear"
                    maxlength="2"
                    formControlName="tenureYear"
                    placeholder="Year"
                  />
                </mat-form-field>
                <span class="vl"></span>
                <mat-form-field
                  appearance="outline"
                  class="full-width inputSelect"
                >
                  <input
                    matInput
                    name="tenureMonth"
                    maxlength="2"
                    formControlName="tenureMonth"
                    placeholder="Month"
                  />
                </mat-form-field>
                <span class="vl"></span>

                <mat-form-field
                  appearance="outline"
                  class="full-width inputSelect"
                >
                  <input
                    matInput
                    name="tenureDays"
                    maxlength="2"
                    formControlName="tenureDays"
                    placeholder="Day"
                  />
                </mat-form-field>
              </div>
            </fieldset>
          </div>
          <div class="col-md-6 col-12">
            <label class="calculator_subTItle">Interest Rate</label>
            <mat-form-field
              appearance="outline"
              class="full-width field-changedInput"
            >
              <mat-label class="custom-mat-label">Percentage</mat-label>
              <input matInput numbersOnly formControlName="interestRate" />
            </mat-form-field>
          </div>
          <div class="col-12" fxLayout="column">
            <label class="calculator_subTItle">Repayment Options</label>
            <mat-radio-group formControlName="repaymentOption">
              <mat-radio-button
                class="example-margin"
                value="Complete Moratorium"
              >
                Complete Moratorium
              </mat-radio-button>
              <mat-radio-button
                class="example-margin"
                value="Principal Moratorium"
              >
                Principal Moratorium
              </mat-radio-button>
              <mat-radio-button class="example-margin" value="Full EMI">
                Full EMI
              </mat-radio-button>
            </mat-radio-group>
          </div>
        </div>
        <div class="downImage">
          <img src="assets/images/Group 13767.svg" />
        </div>
      </div>
    </form>
  </div>

  <div
    fxFlex="30"
    style="background-color: white; margin-left: -1%; margin-top: 10%"
  >
    <div
      fxFlex="80"
      fxLayoutAlign="center center"
      fxLayout="column"
      class="fd_container"
    >
      <div fxLayout="column" class="alignCenter">
        <div class="maturityTitle">Loan Required</div>
        <div class="maturityTitle" style="color: #004c97">₹ 43,484</div>
      </div>
      <div fxLayout="row" fxFlex="100" style="width: 100%">
        <div
          fxLayout="column"
          fxFlex="48"
          class="alignLeft"
          fxLayoutAlign="space-around center"
        >
          <div class="maturityTitle">EMI</div>
          <div class="gd_value">₹ 12,669</div>
        </div>
        <div class="vl"></div>
        <div
          fxLayout="column"
          class="alignLeft"
          fxFlex="48"
          fxLayoutAlign="space-around center"
        >
          <div class="maturityTitle">Loan Tenure</div>
          <div class="gd_value">{{ loanForm.value.interestRate }} Months</div>
        </div>
      </div>
      <div fxLayout="row" fxFlex="100" style="width: 100%">
        <div
          fxLayout="column"
          class="alignLeft"
          fxFlex="48"
          fxLayoutAlign="space-around center"
        >
          <div class="maturityTitle">Max Unsecured Loan ammount limit</div>
          <div class="gd_value">₹ 1,00,00,000</div>
        </div>
        <div class="vl"></div>
      </div>
      <div>
        <button mat-flat-button class="confirmtn" (click)="applyForLoan()">
          Tax Benefits
        </button>
        <button mat-flat-button class="backBtn" (click)="onBack()">Back</button>
      </div>
      <img class="designImg-1" src="assets/images/Mask Group.svg" />
    </div>
  </div>
</div>
