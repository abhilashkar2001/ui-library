<div fxFlex="row" fxFlex="100%">
  <div fxFlex="70" fxLayout="column" fxFlex="100" *ngIf="loanForm">
    <form [formGroup]="loanForm" fxFlex="100">
      <div class="calculator_container" fxLayout="column" fxFlex="100">
        <div
          fxLayout="row wrap"
          fxFlex="100"
          fxLayoutAlign="space-between center"
        >
          <div class="calculator_subTItle">Loan Ammount</div>
          <div>
            <div fxFlex="100">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label class="custom-mat-label">Ammount</mat-label>
                <input matInput formControlName="amount" />
              </mat-form-field>
            </div>
          </div>
        </div>
        <div fxFlex="100">
          <mat-slider
            [value]="loanForm.value.amount"
            [max]="max"
            [min]="min"
            fxFlex="100"
            [thumbLabel]="thumbLabel"
            (change)="onSliderChange($event)"
            discrete
          >
            <input matSliderThumb #slider />
          </mat-slider>
        </div>
        <div fxLayout="row" fxFlex="100" fxLayoutAlign="space-between center">
          <div>$ {{ min }}</div>
          <div>$ {{ max }}</div>
        </div>

        <div
          class="row"
          fxLayoutAlign="space-between center"
          style="margin-top: 27px"
        >
          <div class="col-md-6 col-12">
            <label class="calculator_subTItle">Tenure</label>
            <fieldset class="yeardrop fieldset">
              <legend visible="true" class="legend-font legend">
                Deposit Period
              </legend>
              <div fxLayout="row" class="parentYearDiv">
                <mat-form-field
                  appearance="outline"
                  class="full-width inputSelect"
                >
                  <input
                    matInput
                    name="tenureYear"
                    maxlength="2"
                    formControlName="tenureYear"
                    placeholder="Year"
                  />
                </mat-form-field>
                <span class="vl"></span>
                <mat-form-field
                  appearance="outline"
                  class="full-width inputSelect"
                >
                  <input
                    matInput
                    name="tenureMonth"
                    maxlength="2"
                    formControlName="tenureMonth"
                    placeholder="Month"
                  />
                </mat-form-field>
                <span class="vl"></span>

                <mat-form-field
                  appearance="outline"
                  class="full-width inputSelect"
                >
                  <input
                    matInput
                    name="tenureDays"
                    maxlength="2"
                    formControlName="tenureDays"
                    placeholder="Day"
                  />
                </mat-form-field>
              </div>
            </fieldset>
          </div>
          <div class="col-md-6 col-12">
            <label class="calculator_subTItle">Interest Rate</label>
            <mat-form-field
              appearance="outline"
              class="full-width field-changedInput"
            >
              <mat-label class="custom-mat-label">Percentage</mat-label>
              <input matInput numbersOnly formControlName="interestRate" />
            </mat-form-field>
          </div>
        </div>
        <div class="downImage"></div>
      </div>
    </form>
  </div>

  <div fxFlex="30" style="background-color: white; margin-left: -1%">
    <div
      fxFlex="80"
      fxLayoutAlign="center center"
      fxLayout="column"
      class="fd_container"
    >
      <div fxLayout="column" class="alignCenter">
        <div class="maturityTitle">EMI Ammount</div>
        <div class="maturityTitle" style="color: #004c97">₹ 1,10,202</div>
      </div>
      <div fxLayout="row" fxFlex="100" style="width: 100%">
        <div
          fxLayout="column"
          fxFlex="48"
          class="alignLeft"
          fxLayoutAlign="space-around center"
        >
          <div class="maturityTitle">Interest Payable</div>
          <div class="gd_value">₹ 12,669</div>
        </div>
        <div class="vl"></div>
        <div
          fxLayout="column"
          class="alignLeft"
          fxFlex="48"
          fxLayoutAlign="space-around center"
        >
          <div class="maturityTitle">Interest Rate</div>
          <div class="gd_value">₹ 12,669</div>
        </div>
      </div>
      <div fxLayout="row" fxFlex="100" style="width: 100%">
        <div
          fxLayout="column"
          class="alignLeft"
          fxFlex="48"
          fxLayoutAlign="space-around center"
        >
          <div class="maturityTitle">Principal Ammount</div>
          <div class="gd_value">₹ 12,669</div>
        </div>
        <div class="vl"></div>
        <div
          fxLayout="column"
          class="alignLeft"
          fxFlex="48"
          fxLayoutAlign="space-around center"
        >
          <div class="maturityTitle">Total Ammount Payable</div>
          <div class="gd_value">₹ 12,669</div>
        </div>
      </div>
      <div>
        <button mat-flat-button class="openFDbtn" (click)="applyForLoan()">
          Apply
        </button>
      </div>
    </div>
  </div>
</div>
