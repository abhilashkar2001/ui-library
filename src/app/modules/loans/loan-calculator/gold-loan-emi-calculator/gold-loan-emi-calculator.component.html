<div class="loan-emi-calculator">
  <form [formGroup]="loanForm" fxFlex="100">
    <img class="designImg" src="assets/images/Mask Group.svg" />
    <div fxLayout="column" class="calculator-section">
      <div class="tenur-section">
        <div class="col-md-6 col-12">
          <label class="calculator_subTItle">Tenure</label>
          <fieldset class="yeardrop fieldset">
            <legend visible="true" class="legend-font legend">
              Deposit Period
            </legend>
            <div fxLayout="row" class="parentYearDiv">
              <mat-form-field
                appearance="outline"
                class="full-width inputSelect"
              >
                <input
                  matInput
                  name="tenureYear"
                  maxlength="2"
                  formControlName="tenureYear"
                  placeholder="Year"
                />
              </mat-form-field>
              <span class="vl"></span>
              <mat-form-field
                appearance="outline"
                class="full-width inputSelect"
              >
                <input
                  matInput
                  name="tenureMonth"
                  maxlength="2"
                  formControlName="tenureMonth"
                  placeholder="Month"
                />
              </mat-form-field>
              <span class="vl"></span>

              <mat-form-field
                appearance="outline"
                class="full-width inputSelect"
              >
                <input
                  matInput
                  name="tenureDays"
                  maxlength="2"
                  formControlName="tenureDays"
                  placeholder="Day"
                />
              </mat-form-field>
            </div>
          </fieldset>
        </div>
        <div class="col">
          <label for="tenure"> Ornaments</label>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label class="custom-mat-label">Number</mat-label>
            <input matInput numbersOnly formControlName="ornaments" />
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <label for="tenure"> Caret</label>
          <mat-form-field
            appearance="outline"
            class="full-width field-changedInput"
          >
            <mat-label class="custom-mat-label">Number is (K)</mat-label>
            <input matInput numbersOnly formControlName="carat" />
          </mat-form-field>
        </div>
        <div class="col">
          <label for="tenure"> Weight</label>
          <mat-form-field
            appearance="outline"
            class="full-width field-changedInput"
          >
            <mat-label class="custom-mat-label">Grams</mat-label>
            <input matInput numbersOnly formControlName="weight" />
          </mat-form-field>
        </div>
      </div>
      <div class="field-section">
        <div class="label">Loan Amount</div>
        <div style="width: 30%">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label class="custom-mat-label">Ammount</mat-label>
            <input matInput formControlName="amount" />
          </mat-form-field>
        </div>
      </div>
      <div fxFlex="100">
        <mat-slider
          [(ngModel)]="loanForm.value.amount"
          [max]="max"
          [min]="min"
          fxFlex="100"
          [thumbLabel]="thumbLabel"
          (change)="onSliderChange($event)"
          discrete
        >
          <input matSliderThumb #slider />
        </mat-slider>
      </div>
      <div fxLayout="row" fxFlex="100" fxLayoutAlign="space-between center">
        <div>$ {{ min }}</div>
        <div>$ {{ max }}</div>
      </div>
      <div class="downImage">
        <img src="assets/images/Group 13767.svg" />
      </div>
    </div>
  </form>
  <div
    fxFlex="30"
    style="background-color: white; margin-left: -1%; margin-top: 10%"
  >
    <div
      fxFlex="80"
      fxLayoutAlign="center center"
      fxLayout="column"
      class="fd_container"
    >
      <div fxLayout="column" class="alignCenter">
        <div class="maturityTitle">EMI Ammount</div>
        <div
          class="total-amount"
          style="color: #004c97; font-size: xx-large; font-weight: bolder"
        >
          ₹ 42,669
        </div>
      </div>
      <div fxLayout="row" fxFlex="100" style="width: 100%">
        <div
          fxLayout="column"
          fxFlex="48"
          class="alignLeft"
          fxLayoutAlign="space-around center"
        >
          <div class="maturityTitle">Carat (in K)</div>
          <div class="gd_value">24</div>
        </div>
        <div class="vl"></div>
        <div
          fxLayout="column"
          class="alignLeft"
          fxFlex="48"
          fxLayoutAlign="space-around center"
        >
          <div class="maturityTitle">Weight (in Grams)</div>
          <div class="gd_value">20</div>
        </div>
      </div>
      <div fxLayout="row" fxFlex="100" style="width: 100%">
        <div
          fxLayout="column"
          class="alignLeft"
          fxFlex="48"
          fxLayoutAlign="space-around center"
        >
          <div class="maturityTitle">Tenure</div>
          <div class="gd_value">1 year</div>
        </div>
        <div class="vl"></div>
        <div
          fxLayout="column"
          class="alignLeft"
          fxFlex="48"
          fxLayoutAlign="space-around center"
        >
          <div class="maturityTitle">Amount</div>
          <div class="gd_value">₹ 88,998</div>
        </div>
      </div>
      <div>
        <button mat-flat-button class="openFDbtn" (click)="applyForLoan()">
          Apply
        </button>
      </div>
      <img class="designImg-1" src="assets/images/Mask Group.svg" />
    </div>
  </div>
</div>
