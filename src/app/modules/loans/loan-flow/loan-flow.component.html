<div class="mt-20">
  <div fxFlex="40" class="fdCalculator_parent">
    <app-commmon-steeper
      [screenTitle]="screenTitle"
      [screenList]="screenList"
      [screenIndex]="selectedStep"
      (customSelectionChange)="stepperSelectionChange($event)"
    ></app-commmon-steeper>
  </div>
  <div
    class="vertical_divider"
    style="border-right: 1px solid #cbcbcb; height: 450px"
  ></div>

  <div class="col-div2 screenMargin" fxFlex="60" fxLayout="column">
    <h2 class="highlight_title" *ngIf="currentComponentInfo?.component">
      {{ cuurrentStep }}
    </h2>
    <div>
      <ng-template appAppHost #container></ng-template>
    </div>
  </div>
</div>
