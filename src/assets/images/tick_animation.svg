<svg height="100" viewBox="0 0 100 100" width="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Ripple Effect -->
  <circle cx="50" cy="50" fill="none" r="10" stroke="#008461" stroke-width="3">
    <animate attributeName="r" dur="1.5s" from="10" repeatCount="indefinite" to="40" />
    <animate attributeName="opacity" dur="1.5s" from="1" repeatCount="indefinite" to="0" />
  </circle>

  <circle cx="50" cy="50" fill="none" r="10" stroke="#008461" stroke-width="3">
    <animate attributeName="r" begin="0.5s" dur="1.5s" from="10" repeatCount="indefinite"
             to="40" />
    <animate attributeName="opacity" begin="0.5s" dur="1.5s" from="1" repeatCount="indefinite"
             to="0" />
  </circle>

  <!-- Tick Background -->
  <circle cx="50" cy="50" fill="#008461" r="20" />

  <!-- Tick Mark -->
  <path d="M42,50 L48,56 L58,42" fill="none" stroke="white" stroke-linecap="round"
        stroke-linejoin="round" stroke-width="3">
    <animate attributeName="stroke-dasharray" begin="0.5s" dur="0.5s" fill="freeze" from="0,30"
             to="30,0" />
  </path>
</svg>