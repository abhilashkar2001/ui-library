<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <!-- Ripple Effect -->
    <circle cx="50" cy="50" r="10" fill="none" stroke="#008461" stroke-width="3">
        <animate attributeName="r" from="10" to="40" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" from="1" to="0" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <circle cx="50" cy="50" r="10" fill="none" stroke="#008461" stroke-width="3">
        <animate attributeName="r" from="10" to="40" dur="1.5s" begin="0.5s"
            repeatCount="indefinite" />
        <animate attributeName="opacity" from="1" to="0" dur="1.5s" begin="0.5s"
            repeatCount="indefinite" />
    </circle>

    <!-- Tick Background -->
    <circle cx="50" cy="50" r="20" fill="#008461" />

    <!-- Tick Mark -->
    <path d="M42,50 L48,56 L58,42" fill="none" stroke="white" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dasharray" from="0,30" to="30,0" dur="0.5s" begin="0.5s"
            fill="freeze" />
    </path>
</svg>